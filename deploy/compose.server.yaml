# Server overlay for staging and production: run images copied by deploy/deploy.sh
# and restart after reboots. Selected on servers through COMPOSE_FILE in /opt/axon/.env.
services:
  caddy:
    build: !reset null
    restart: unless-stopped
  api:
    build: !reset null
    restart: unless-stopped
    ports:
      - "9464:9464" # Prometheus metrics, scraped from srv-monitoring like the other fleet exporters
  web:
    build: !reset null
    restart: unless-stopped
  db:
    build: !reset null
    restart: unless-stopped
  anki:
    build: !reset null
    restart: unless-stopped
  backup:
    image: axon-backup:${AXON_VERSION:?}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
    volumes:
      - ./backups:/backups
      - ./deploy/env/recipients.txt:/etc/axon/recipients.txt:ro
      - ./backup_ed25519:/run/secrets/backup_ed25519:ro
      - /var/lib/prometheus/node-exporter/axon_backup.prom:/textfile/axon_backup.prom
    depends_on:
      db:
        condition: service_healthy
  # Public access through a Cloudflare Tunnel (owner request): cloudflared
  # dials out to Cloudflare, so no port opens on the network. Off until the
  # settings name its profile (COMPOSE_PROFILES=tunnel) and the secrets its
  # token; the tunnel's public hostname points at http://caddy:3000.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-} # a secret: in the .env.age file
    depends_on: [caddy]
