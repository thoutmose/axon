              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
                description: { type: string, maxLength: 20000 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roadmap" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/roadmaps/sources:
    get:
      tags: [roadmaps]
      operationId: listRoadmapSources
      summary: Curricula and curated library domains that can be imported, with licence and attribution
      responses:
        "200":
          description: Sources.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, title, description, attribution, license_url, count, skills]
                      properties:
                        id: { type: string, example: system-design }
                        kind: { type: string, enum: [curriculum, library] }
                        title: { type: string }
                        description: { type: string }
                        attribution: { type: string }
                        license_url: { type: [string, "null"] }
                        count: { type: integer, description: Courses or resources in it. }
                        skills: { type: integer, description: Skills the courses or resources are grouped into. }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/roadmaps/radar:
    get:
      tags: [roadmaps]
      operationId: getSkillsRadar
      summary: Hard and soft skills acquired, by area, for a radar chart
      description: >-
        One spoke per roadmap holding skills of that kind; under three such roadmaps, one spoke
        per section. Skipped skills are not counted. At most nine spokes: the smallest areas are
        added up as "Other".
      responses:
        "200":
          description: The radar.
          content:
            application/json:
              schema:
                type: object
                required: [hard, soft]
                properties:
                  hard: { $ref: "#/components/schemas/RadarKind" }
                  soft: { $ref: "#/components/schemas/RadarKind" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/roadmaps/import:
    post:
      tags: [roadmaps]
      operationId: importRoadmap
      summary: Start a roadmap of the library, with its whole plan (goal, milestones, projects, habits, tasks); roadmap.sh content may not be redistributed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
