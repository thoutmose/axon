  /v1/auth/providers:
    get:
      tags: [auth]
      operationId: listSignInProviders
      summary: "Other accounts this Axon accepts for sign-in (Google, Microsoft, Apple, Discord, Slack, or a single sign-on)"
      security: []
      responses:
        "200":
          description: The providers the operator configured.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string, enum: [google, microsoft, apple, discord, slack, oidc] }
                        name: { type: string }
  /v1/auth/oauth/{provider}/start:
    get:
      tags: [auth]
      operationId: startProviderSignIn
      summary: "Go to the provider to sign in, or (signed in) to link it to your account"
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: intent, in: query, schema: { type: string, enum: [signin, link], default: signin } }
        - { name: next, in: query, description: "A path on this site to open after signing in.", schema: { type: string } }
      responses:
        "302": { description: "To the provider, with PKCE, a state bound to a cookie, and a nonce." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
