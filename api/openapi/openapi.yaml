  /v1/notes/import:
    post:
      tags: [notes]
      operationId: importNotes
      summary: Import a ZIP of Markdown files (up to 50 MB); existing notes are never overwritten
      description: A leading notes/ folder is stripped, so an export archive imports as is. A file whose path holds different content is reported as a conflict and left untouched.
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, contentMediaType: application/zip }
      responses:
        "200":
          description: What happened to each file.
          content:
            application/json:
              schema:
                type: object
                required: [created, unchanged, conflicts, skipped]
                properties:
                  created: { type: array, items: { type: string } }
                  unchanged: { type: array, items: { type: string } }
                  conflicts: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /v1/notes/sync:
    get:
      tags: [notes]
      operationId: noteChanges
      summary: Notes changed and deleted since a cursor, oldest first (for sync clients)
      parameters:
        - name: cursor
          in: query
          description: cursor from the previous response; omit for everything.
          schema: { type: string }
      responses:
        "200":
          description: Up to 100 changed notes with content, and deletions.
          content:
            application/json:
              schema:
                type: object
                required: [notes, tombstones, cursor, more]
                properties:
                  notes: { type: array, items: { $ref: "#/components/schemas/Note" } }
                  tombstones:
                    type: array
                    items:
                      type: object
                      required: [path, deleted_at]
                      properties:
                        path: { type: string }
                        deleted_at: { type: string, format: date-time }
                  cursor: { type: string }
                  more: { type: boolean, description: "True when another page is waiting." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [notes]
      operationId: pushNote
      summary: Write a file from the vault, only if Axon still holds the version the client last synced
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content, base_hash]
              additionalProperties: false
              properties:
                path: { $ref: "#/components/schemas/NotePath" }
                content: { $ref: "#/components/schemas/NoteContent" }
                base_hash: { type: string, description: "Hash both sides last agreed on; empty for a file Axon has never had." }
      responses:
        "200":
          description: Stored (or already identical); content omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/SyncConflict" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/notes/sync/delete:
