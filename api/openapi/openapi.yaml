        "404": { $ref: "#/components/responses/Problem" }
  /v1/search:
    get:
      tags: [graph]
      operationId: search
      summary: Full-text search across all of the caller's entities
      parameters:
        - name: q
          in: query
          required: true
          description: Web-style query ("quoted phrase", -exclude, or).
          schema: { type: string, minLength: 1, maxLength: 500 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        - name: type
          in: query
          description: Only entities of this type, e.g. note.
          schema: { type: string, maxLength: 40 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matches, best first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SearchHit" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/tasks:
    get:
      tags: [tasks]
