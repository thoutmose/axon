      tags: [cards]
      operationId: getCard
      summary: One card
      responses:
        "200":
          description: The card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flashcard" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [cards]
      operationId: updateCard
      summary: Change a card's text, deck, suspension, or place in a memory palace (its schedule is kept)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                front: { type: string, minLength: 1, maxLength: 10000 }
                back: { type: string, maxLength: 10000 }
                deck: { type: string, minLength: 1, maxLength: 200 }
                suspended: { type: boolean }
                elaboration: { type: string, maxLength: 2000, description: "Why or how it is true (elaboration)." }
                example: { type: string, maxLength: 2000, description: A concrete example. }
                mnemonic: { type: string, maxLength: 2000, description: "A vivid image or mnemonic tying the question to the answer." }
                palace_id: { type: string, description: "A memory palace to place the card in, or empty to take it out." }
                locus: { type: integer, minimum: 0, maximum: 99, description: "The place in the palace (0 is the first)." }
      responses:
        "200":
          description: The card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flashcard" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cards]
      operationId: deleteCard
      summary: Delete a card and its review history
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/flashcards/{id}/review:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [cards]
      operationId: reviewCard
      summary: Record a review (1 again, 2 hard, 3 good, 4 easy) and reschedule with FSRS-5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              additionalProperties: false
              properties:
                rating: { type: integer, minimum: 1, maximum: 4 }
                duration_ms: { type: integer, minimum: 0, maximum: 3600000 }
      responses:
        "200":
          description: The rescheduled card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flashcard" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
