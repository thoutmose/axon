    get:
      tags: [wellbeing]
      operationId: listJournal
      summary: Journal entries from one day to another, newest first
      description: The last 30 days by default. Needs the health_data consent (mood and sleep are health data).
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: The entries, and today in your time zone.
          content:
            application/json:
              schema:
                type: object
                required: [items, today]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
                  today: { type: string, format: date }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/journal/helps:
    get:
      tags: [wellbeing]
      operationId: getWhatHelps
      summary: Which of your days' habits go with a better or worse mood, energy, or stress
      description: >-
        Over the last 90 days: Spearman rank correlation between each factor (sleep, training, focus, habits
        kept, tasks finished, gratitude) and each outcome (mood, energy, stress), a permutation test per pair,
        and the Benjamini–Hochberg correction. Only clear links are returned, each with the averages behind it.
        A link is not proof of cause. Needs the health_data consent.
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema:
                type: object
                required: [days, needed, tested, findings, method]
                properties:
                  days: { type: integer, description: Days with something in the journal. }
                  needed: { type: integer, description: More days needed before anything can be said. }
                  tested: { type: integer, description: Pairs tested. }
                  method: { type: string }
                  findings:
                    type: array
                    maxItems: 6
                    items:
                      type: object
                      required: [factor, outcome, rho, p, q, n, mean_with, mean_without, days_with, days_without, strength, sentence]
                      properties:
                        factor: { type: string, enum: [sleep, water, training, focus, habits, tasks, gratitude] }
                        outcome: { type: string, enum: [mood, energy, stress] }
                        rho: { type: number }
                        p: { type: number }
                        q: { type: number }
                        n: { type: integer }
                        mean_with: { type: number }
                        mean_without: { type: number }
                        days_with: { type: integer }
                        days_without: { type: integer }
                        strength: { type: string, enum: [moderate, strong] }
                        sentence: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/journal/{day}:
    parameters:
      - { name: day, in: path, required: true, schema: { type: string, format: date } }
    get:
      tags: [wellbeing]
      operationId: getJournalEntry
      summary: One day of the journal
      responses:
        "200": { description: The entry., content: { application/json: { schema: { $ref: "#/components/schemas/JournalEntry" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [wellbeing]
      operationId: putJournalEntry
      summary: Write the day's entry, replacing what was there
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mood: { type: [integer, "null"], minimum: 1, maximum: 5 }
                energy: { type: [integer, "null"], minimum: 1, maximum: 5 }
                stress: { type: [integer, "null"], minimum: 1, maximum: 5 }
                sleep_hours: { type: [number, "null"], minimum: 0, maximum: 24 }
                gratitude: { type: array, maxItems: 3, items: { type: string, maxLength: 300 } }
                note: { type: string, maxLength: 10000 }
      responses:
        "200": { description: The entry., content: { application/json: { schema: { $ref: "#/components/schemas/JournalEntry" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [wellbeing]
      operationId: deleteJournalEntry
      summary: Delete the day's entry
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
