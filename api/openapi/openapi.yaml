          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Notes ordered by path (without content)
      parameters:
        - name: para
          in: query
          schema: { $ref: "#/components/schemas/NotePara" }
        - name: tag
          in: query
          description: Only notes with this tag.
          schema: { type: string }
        - name: path
          in: query
          description: Only the note at exactly this path (e.g. a daily note).
          schema: { type: string }
        - name: mirrored
          in: query
          description: "false leaves out the notes the vault mirror keeps for tasks, goals, habits, and other items."
          schema: { type: string, enum: ["false"] }
        - name: kind
          in: query
          description: "Only notes of this type (front matter type), e.g. fleeting, literature, permanent."
          schema: { type: string, maxLength: 100 }
        - name: folder
          in: query
          description: "Only notes under this folder, e.g. Templates/ (vault templates are offered when creating a note)."
          schema: { type: string }
        - name: after
          in: query
          description: next_cursor from the previous page (the last path).
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of notes.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Note" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [notes]
      operationId: createNote
      summary: Create a note (in 0-Inbox, named after its title, unless a path is given)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              additionalProperties: false
              properties:
                path: { $ref: "#/components/schemas/NotePath" }
                content: { $ref: "#/components/schemas/NoteContent" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/notes/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [notes]
      operationId: getNote
      summary: One note with its Markdown
      responses:
        "200":
          description: The note.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [notes]
      operationId: updateNote
      summary: Replace a note's Markdown or move it; a rename rewrites [[wikilinks]] to it in other notes
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              additionalProperties: false
              properties:
                path: { $ref: "#/components/schemas/NotePath" }
                content: { $ref: "#/components/schemas/NoteContent" }
      responses:
        "200":
          description: The updated note.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: Delete a note and its links (a sync client then deletes the file)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/notes/tags:
    get:
      tags: [notes]
      operationId: listNoteTags
      summary: Tags in use (front matter and #tags), most used first
      responses:
        "200":
          description: Up to 200 tags.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [tag, count]
                      properties:
                        tag: { type: string }
                        count: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/notes/{id}/mentions:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [notes]
      operationId: listNoteMentions
      summary: Notes that name this note in plain text but do not link to it yet
      responses:
        "200":
          description: Up to 20 notes, most recently changed first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, path]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        path: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/notes/import:
    post:
      tags: [notes]
      operationId: importNotes
      summary: Import a ZIP of Markdown files (up to 50 MB); existing notes are never overwritten
      description: A leading notes/ folder is stripped, so an export archive imports as is. A file whose path holds different content is reported as a conflict and left untouched.
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, contentMediaType: application/zip }
      responses:
        "200":
          description: What happened to each file.
          content:
            application/json:
              schema:
                type: object
                required: [created, unchanged, conflicts, skipped]
                properties:
                  created: { type: array, items: { type: string } }
                  unchanged: { type: array, items: { type: string } }
                  conflicts: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /v1/notes/explore:
    get:
      tags: [notes]
      operationId: exploreNotes
      summary: Filter notes by PARA, type, tag, text, and date, with statistics for charts and each note's keywords
      parameters:
        - { name: para, in: query, schema: { type: string, enum: [inbox, projects, areas, resources, archive, other] } }
        - { name: kind, in: query, description: "Zettelkasten type from front matter (fleeting, literature, permanent…).", schema: { type: string, maxLength: 50 } }
        - { name: tag, in: query, schema: { type: string, maxLength: 100 } }
        - { name: q, in: query, description: Text in the title or body., schema: { type: string, maxLength: 200 } }
        - { name: from, in: query, description: Created on or after., schema: { type: string, format: date } }
        - { name: to, in: query, description: Created on or before., schema: { type: string, format: date } }
        - { name: orphans, in: query, description: Only notes with no connection., schema: { type: boolean } }
      responses:
        "200":
          description: Up to 1,500 notes, newest first, and their statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteExploration" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/notes/analysis:
    get:
      tags: [notes]
      operationId: analyseNotes
      summary: Topics and a concept graph of your literature and permanent notes
      description: "All local, no AI provider: Snowball stemming (English and French), TextRank key phrases, topics by label propagation over TF-IDF similarity, concepts in at least two notes linked by NPMI or as Open English WordNet synonyms."
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [literature, permanent] }, description: "Both kinds when omitted." }
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteCorpusAnalysis" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/notes/{id}/analysis:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [notes]
      operationId: analyseNote
      summary: One note's key phrases, readability, topic, and closest literature and permanent notes with reasons
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteAnalysis" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/notes/zettelkasten-graph:
    get:
      tags: [notes]
      operationId: zettelkastenGraph
      summary: A knowledge graph of your literature and permanent notes, with communities, importance, and bridges
      description: "All local. Edge score = 0.45 × TF-IDF cosine + 0.30 × key-phrase overlap weighted by IDF + 0.15 × WordNet synonyms + 0.10 × shared named entities (+0.5 for your own links, always kept), sparsified to each note's strongest neighbours. Communities by Louvain modularity, labelled by class-based TF-IDF; importance by weighted PageRank; bridges by the participation coefficient."
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [literature, permanent] }, description: "Both kinds when omitted." }
        - { name: min, in: query, schema: { type: number, minimum: 0, maximum: 1 }, description: "Minimum score for NLP edges (at least 0.08)." }
      responses:
        "200":
          description: The graph.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZettelGraph" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/notes/graph:
    get:
      tags: [notes]
      operationId: noteKnowledgeGraph
      summary: A knowledge graph of the filtered notes, from links and local NLP, where every edge says why
      description: >
        Edges are wikilinks and connections (always kept), then the strongest NLP reason per pair:
        a shared named entity, shared TF-IDF keywords, thesaurus synonyms, or similar wording
        (cosine similarity). At most six NLP edges per note. No AI provider is involved.
      parameters:
        - { name: para, in: query, schema: { type: string, enum: [inbox, projects, areas, resources, archive, other] } }
        - { name: kind, in: query, description: "Zettelkasten type from front matter (fleeting, literature, permanent…).", schema: { type: string, maxLength: 50 } }
        - { name: tag, in: query, schema: { type: string, maxLength: 100 } }
        - { name: q, in: query, description: Text in the title or body., schema: { type: string, maxLength: 200 } }
        - { name: from, in: query, description: Created on or after., schema: { type: string, format: date } }
        - { name: to, in: query, description: Created on or before., schema: { type: string, format: date } }
        - { name: orphans, in: query, description: Only notes with no connection., schema: { type: boolean } }
      responses:
        "200":
          description: Nodes and edges (up to 600 notes).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeGraph" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/notes/sync/version:
    get:
      tags: [notes]
      operationId: getNotesSyncVersion
      summary: "A cheap fingerprint of your notes; it changes on every create, edit, rename, or delete, so a watching sync knows when to run"
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string, example: "42|2026-10-11T12:00:00Z|-" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/notes/sync:
    get:
      tags: [notes]
      operationId: noteChanges
      summary: Notes changed and deleted since a cursor, oldest first (for sync clients)
      parameters:
        - name: cursor
          in: query
          description: cursor from the previous response; omit for everything.
          schema: { type: string }
      responses:
        "200":
          description: Up to 100 changed notes with content, and deletions.
          content:
            application/json:
              schema:
                type: object
                required: [notes, tombstones, cursor, more]
                properties:
                  notes: { type: array, items: { $ref: "#/components/schemas/Note" } }
                  tombstones:
                    type: array
                    items:
                      type: object
                      required: [path, deleted_at]
                      properties:
                        path: { type: string }
                        deleted_at: { type: string, format: date-time }
                  cursor: { type: string }
                  more: { type: boolean, description: "True when another page is waiting." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [notes]
      operationId: pushNote
      summary: Write a file from the vault, only if Axon still holds the version the client last synced
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content, base_hash]
              additionalProperties: false
              properties:
                path: { $ref: "#/components/schemas/NotePath" }
                content: { $ref: "#/components/schemas/NoteContent" }
                base_hash: { type: string, description: "Hash both sides last agreed on; empty for a file Axon has never had." }
      responses:
        "200":
          description: Stored (or already identical); content omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/SyncConflict" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/notes/sync/delete:
    post:
      tags: [notes]
      operationId: pushNoteDeletion
      summary: Delete a note removed from the vault, only if Axon still holds the version the client last synced
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, base_hash]
              additionalProperties: false
              properties:
                path: { type: string }
                base_hash: { type: string }
      responses:
        "204": { description: "Deleted, or already gone." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/SyncConflict" }

  /v1/notes/files:
    get:
      tags: [notes]
      operationId: listNoteFiles
      summary: Every picture and PDF notes embed, and the paths deleted in the last 30 days (for the editor and the vault sync)
      responses:
        "200":
          description: The files, by path.
          content:
            application/json:
              schema:
                type: object
                required: [items, tombstones]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/NoteFile" }
                  tombstones:
                    type: array
                    items:
                      type: object
                      required: [path, deleted_at]
                      properties:
                        path: { type: string }
                        deleted_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [notes]
      operationId: uploadNoteFile
      summary: Add a picture or PDF from the editor; it is stored under Attachments/ with a name made unique by its content. PNG and JPEG pictures (up to 20 MB) are scaled to fit 2400 px and re-encoded without metadata; other files are kept as sent (up to 10 MB)
      parameters:
        - name: name
          in: query
          required: true
          description: The original file name; its extension must match the Content-Type.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/gif: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/svg+xml: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Stored; embed it as ![](path).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }

  /v1/notes/file:
    parameters:
      - name: path
        in: query
        required: true
        description: Vault path, such as Attachments/photo.png.
        schema: { type: string, maxLength: 500 }
    get:
      tags: [notes]
      operationId: getNoteFile
      summary: One file's bytes; sandboxed so nothing in it can run, and PDFs download
      responses:
        "200":
          description: The file.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "304": { description: "Not modified." }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    put:
      tags: [notes]
      operationId: pushNoteFile
      summary: Write a file from the vault sync, byte for byte, only if Axon still holds the version the client last synced
      parameters:
        - name: base_hash
          in: query
          description: The hash both sides last agreed on; empty or absent for a file new to Axon.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Stored, or already identical.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteFile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/FileConflict" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "507": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [notes]
      operationId: deleteNoteFile
      summary: Delete a file; with base_hash (the vault sync), only if Axon still holds that version
      parameters:
        - name: base_hash
          in: query
          schema: { type: string }
      responses:
        "204": { description: "Deleted, or already gone." }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/FileConflict" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/learning/plan:
    get:
      tags: [learning]
      operationId: getLearningPlan
      summary: "Today's plan to learn and remember: cards to review (with minutes, retention, and leeches), notes to recall, whether a weekly practice test is due, fleeting notes to process, and the streak"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningPlan" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/learning/tests:
    post:
      tags: [learning]
      operationId: recordPracticeTest
      summary: Record a practice test's result (tests do not change when cards are due)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions, correct]
              additionalProperties: false
              properties:
                deck: { type: string, maxLength: 200, description: "Empty for a mixed test of every deck." }
                questions: { type: integer, minimum: 1, maximum: 100 }
                correct: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/certifications:
    get:
      tags: [learning]
      operationId: listCertifications
      summary: Certifications, upcoming exams first
      responses:
        "200":
          description: Certifications.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Certification" } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [learning]
      operationId: createCertification
      summary: Add a certification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, status]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 200, example: Certified Kubernetes Administrator }
                provider: { type: string, maxLength: 100, example: The Linux Foundation }
                code: { type: string, maxLength: 40, example: CKA }
                url: { type: [string, "null"], format: uri }
                status: { enum: [planned, booked, passed, failed] }
                target_on: { type: [string, "null"], format: date, description: "When the plan aims to take it." }
                exam_on: { type: [string, "null"], format: date, description: "Needed when booked or failed." }
                passed_on: { type: [string, "null"], format: date, description: "Defaults to the exam day when passed." }
                expires_on: { type: [string, "null"], format: date, description: "Worked out from passed_on and validity_months when left out." }
                validity_months: { type: [integer, "null"], minimum: 1, maximum: 240 }
                score: { type: string, maxLength: 40 }
                cost_cents: { type: [integer, "null"], minimum: 0 }
                currency: { type: string, pattern: "^[A-Z]{3}$", example: USD }
                credential_url: { type: [string, "null"], format: uri }
                notes: { type: string, maxLength: 5000 }
                skill_id: { type: [string, "null"], format: uuid }
      responses:
        "201":
          description: The certification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certification" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/certifications/{id}:
    put:
      tags: [learning]
      operationId: replaceCertification
      summary: Rewrite a certification (passing sets its expiry from the validity)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, status]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 200, example: Certified Kubernetes Administrator }
                provider: { type: string, maxLength: 100, example: The Linux Foundation }
                code: { type: string, maxLength: 40, example: CKA }
                url: { type: [string, "null"], format: uri }
                status: { enum: [planned, booked, passed, failed] }
                target_on: { type: [string, "null"], format: date, description: "When the plan aims to take it." }
                exam_on: { type: [string, "null"], format: date, description: "Needed when booked or failed." }
                passed_on: { type: [string, "null"], format: date, description: "Defaults to the exam day when passed." }
                expires_on: { type: [string, "null"], format: date, description: "Worked out from passed_on and validity_months when left out." }
                validity_months: { type: [integer, "null"], minimum: 1, maximum: 240 }
                score: { type: string, maxLength: 40 }
                cost_cents: { type: [integer, "null"], minimum: 0 }
                currency: { type: string, pattern: "^[A-Z]{3}$", example: USD }
                credential_url: { type: [string, "null"], format: uri }
                notes: { type: string, maxLength: 5000 }
                skill_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: The certification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certification" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [learning]
      operationId: deleteCertification
      summary: Remove a certification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/practice:
    get:
      tags: [learning]
      operationId: listPractice
      summary: Practice problems with their attempts, most recently tried first
      parameters:
        - { name: due, in: query, schema: { type: boolean }, description: "Only the problems to re-solve by today." }
      responses:
        "200":
          description: Problems, and the person's today.
          content:
            application/json:
              schema:
                type: object
                required: [items, today]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PracticeProblem" } }
                  today: { type: string, format: date }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [learning]
      operationId: logPractice
      summary: Log an attempt at a problem, creating it the first time (a problem with the same link is the same problem)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, platform, difficulty, outcome]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 300, example: Two Sum }
                url: { type: string, format: uri, example: "https://leetcode.com/problems/two-sum/" }
                platform: { enum: [leetcode, codeforces, hackerrank, advent-of-code, exercism, project-euler, overthewire, portswigger, hackthebox, tryhackme, kaggle, other] }
                difficulty: { enum: [easy, medium, hard] }
                topics: { type: array, maxItems: 10, items: { type: string, maxLength: 40 }, example: [arrays, hash table] }
                language: { type: string, maxLength: 20, example: python }
                skill_id: { type: [string, "null"], format: uuid, description: "A roadmap skill the problem practises." }
                outcome: { enum: [solved, with_help, not_solved] }
                minutes: { type: [integer, "null"], minimum: 1, maximum: 1440 }
                "on": { type: string, format: date, description: "Defaults to the person's today; never a later day." }
      responses:
        "200":
          description: Another attempt at a problem already logged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeProblem" }
        "201":
          description: A new problem with its first attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeProblem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/practice/stats:
    get:
      tags: [learning]
      operationId: getPracticeStats
      summary: Problems solved by difficulty, platform, topic, and week
      responses:
        "200":
          description: "Solved means solved unaided at least once; weeks are the last 12, counting each problem's first unaided solve."
          content:
            application/json:
              schema:
                type: object
                required: [problems, solved, due, by_difficulty, by_platform, topics, weeks, minutes]
                properties:
                  problems: { type: integer }
                  solved: { type: integer }
                  due: { type: integer }
                  by_difficulty: { type: object, additionalProperties: { type: integer } }
                  by_platform: { type: object, additionalProperties: { type: integer } }
                  topics:
                    type: array
                    items:
                      type: object
                      required: [topic, solved, total]
                      properties:
                        topic: { type: string }
                        solved: { type: integer }
                        total: { type: integer }
                  weeks:
                    type: array
                    items:
                      type: object
                      required: [week, solved]
                      properties:
                        week: { type: string, format: date }
                        solved: { type: integer }
                  minutes: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/practice/{id}/attempts:
    post:
      tags: [learning]
      operationId: addPracticeAttempt
      summary: Log another attempt at a problem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              additionalProperties: false
              properties:
                outcome: { enum: [solved, with_help, not_solved] }
                minutes: { type: [integer, "null"], minimum: 1, maximum: 1440 }
                "on": { type: string, format: date }
      responses:
        "201":
          description: The problem with its attempts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeProblem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/practice/{id}:
    delete:
      tags: [learning]
      operationId: deletePractice
      summary: Remove a problem and its attempts
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/decisions:
    get:
      tags: [decisions]
      operationId: listDecisions
      summary: Decisions, those to review first by their day, then the reviewed ones
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, due, reviewed] }, description: "open: not reviewed; due: not reviewed and its day has come; reviewed. All when absent." }
      responses:
        "200":
          description: Decisions, and the person's today.
          content:
            application/json:
              schema:
                type: object
                required: [items, today]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Decision" } }
                  today: { type: string, format: date }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      tags: [decisions]
      operationId: createDecision
      summary: Record a decision with the outcome expected and its chance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, expected, probability, review_on]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200, example: Move the API to Go }
                context: { type: string, maxLength: 5000 }
                choice: { type: string, maxLength: 2000, example: Rewrite the hot paths in Go }
                expected: { type: string, minLength: 1, maxLength: 500, example: p99 latency under 100 ms }
                probability: { type: number, minimum: 0.01, maximum: 0.99, description: "The chance that the expected outcome happens. It never changes once given.", example: 0.8 }
                decided_on: { type: string, format: date, description: "Defaults to the person's today; never a later day." }
                review_on: { type: string, format: date, description: "After the decision, within ten years." }
      responses:
        "201":
          description: The decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/decisions/calibration:
    get:
      tags: [decisions]
      operationId: getDecisionCalibration
      summary: How well the reviewed forecasts matched what happened
      responses:
        "200":
          description: "The Brier score is the mean of (chance - outcome)²: 0 is perfect, and always saying 50% scores 0.25. Buckets are the non-empty tenths of chance, lowest first."
          content:
            application/json:
              schema:
                type: object
                required: [count, brier, predicted, happened, buckets]
                properties:
                  count: { type: integer }
                  brier: { type: [number, "null"] }
                  predicted: { type: number }
                  happened: { type: number }
                  buckets:
                    type: array
                    items:
                      type: object
                      required: [from, count, predicted, happened]
                      properties:
                        from: { type: number }
                        count: { type: integer }
                        predicted: { type: number }
                        happened: { type: number }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/decisions/{id}:
    patch:
      tags: [decisions]
      operationId: updateDecision
      summary: Change a decision's title, context, choice, or review day; the forecast cannot change
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                context: { type: string, maxLength: 5000 }
                choice: { type: string, maxLength: 2000 }
                review_on: { type: string, format: date }
                expected: { type: string, description: "Refused with 422: a forecast stays as it was made." }
