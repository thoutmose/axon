        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/projects/{id}/board:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [projects]
      operationId: getBoard
      summary: The Kanban board; a card whose task is done always shows in Done
      responses:
        "200":
          description: The board.
          content:
            application/json:
              schema:
                type: object
                required: [project, columns]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
                  columns:
                    type: array
                    items:
                      type: object
                      required: [id, label, limit, cards]
                      properties:
                        id: { enum: [backlog, todo, doing, done] }
                        label: { type: string }
                        limit: { type: [integer, "null"], description: The WIP limit (Doing only). }
                        cards: { type: array, items: { $ref: "#/components/schemas/Card" } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/projects/{id}/docs:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [projects]
      operationId: listProjectDocs
      summary: Notes in the project's docs folder
      responses:
        "200":
          description: Up to 200 notes, by path.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, path, updated_at]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        path: { type: string }
                        updated_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/projects/{id}/cards:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [projects]
      operationId: addCard
      summary: Create a task and put it on the board
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CardFields"
                - type: object
                  required: [title]
                  properties:
                    title: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/projects/{id}/cards/{task}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
      - { name: task, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [projects]
      operationId: placeCard
      summary: Put an existing task on the board, or move, reorder, or re-parent its card
      description: Entering Doing past the WIP limit answers 409 unless over_limit is true. Moving to Done completes the task; moving a done task out reopens it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardFields" }
      responses:
        "200":
          description: The card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/cards/{task}:
    parameters:
      - { name: task, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [projects]
      operationId: removeCard
      summary: Take a task off its board; the task stays
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: axon_session
      description: Browser session; writes also need a matching Origin header.
    token:
      type: http
      scheme: bearer
      description: Personal access token (axon_…); read or write scope.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    After:
      name: after
      in: query
      description: next_cursor from the previous page.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last GET.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Any unique string (e.g. a UUID); retries with the same key and body replay the first response.
      schema: { type: string, maxLength: 200 }

  headers:
    ETag:
      description: Current version, for If-Match.
      schema: { type: string }

  requestBodies:
    WebAuthnCredential:
      required: true
      description: The browser's PublicKeyCredential, JSON-encoded (WebAuthn Level 3 toJSON()).
      content:
        application/json:
          schema: { type: object }
    TOTPCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            additionalProperties: false
            properties:
              code: { type: string }

  responses:
    Problem:
      description: RFC 9457 problem document.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    WebAuthnOptions:
      description: Options to pass to navigator.credentials (publicKey member).
      content:
        application/json:
          schema:
            type: object
            required: [publicKey]
            properties:
              publicKey: { type: object }
    SyncConflict:
      description: The note changed in Axon since the client last synced; keep both versions.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                required: [current]
                properties:
                  current:
                    oneOf:
                      - $ref: "#/components/schemas/Note"
                      - type: "null"
                    description: Axon's version, or null when the note was deleted in Axon.
    SignedIn:
      description: Signed in; the session cookie is set.
      content:
        application/json:
          schema:
            type: object
            required: [display_name]
            properties:
              display_name: { type: string }

  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Name:
      type: string
      minLength: 1
      maxLength: 100
    Cursor:
      type: [string, "null"]
      description: Pass back as after/before to get the next page; null on the last page.
    RecoveryCodes:
      type: array
      minItems: 10
      maxItems: 10
      items: { type: string, pattern: "^[a-z2-7]{4}-[a-z2-7]{4}-[a-z2-7]{4}-[a-z2-7]{4}$" }
    Me:
      type: object
      required: [id, display_name, timezone, created_at, totp_enabled, passkeys, recovery_codes_remaining]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        totp_enabled: { type: boolean }
        passkeys: { type: integer }
        recovery_codes_remaining: { type: integer }
    Session:
      type: object
      required: [id, user_agent, created_at, last_seen_at, current]
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    Token:
      type: object
      required: [id, name, scope, created_at, last_used_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { enum: [read, write] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, ip, user_agent, details, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        ip: { type: string }
        user_agent: { type: string }
        details: { type: object }
        created_at: { type: string, format: date-time }
    Consent:
      type: object
      required: [id, description, granted, updated_at]
      properties:
        id: { type: string }
        description: { type: string }
        granted: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
    Relation:
      type: object
      required: [name, sources, targets]
      properties:
        name: { type: string }
        sources: { type: array, items: { type: string } }
        targets: { type: array, items: { type: string } }
    Entity:
      type: object
      required: [id, type, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Link:
      type: object
      required: [id, relation, entity, created_at]
      properties:
        id: { type: string, format: uuid }
        relation: { type: string }
        entity: { $ref: "#/components/schemas/Entity" }
        created_at: { type: string, format: date-time }
    Event:
      type: object
      required: [id, actor, entity_type, entity_id, kind, fields, created_at]
      properties:
        id: { type: string, format: uuid }
        actor: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        kind: { enum: [created, updated, deleted, linked, unlinked] }
        fields: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    Task:
      type: object
      required: [id, title, notes, status, context, scheduled_on, due_on, recurrence, series_id, occurrence_on, completed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        notes: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        context: { type: [string, "null"] }
        scheduled_on: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        recurrence: { type: [string, "null"], description: "RFC 5545 RRULE, e.g. FREQ=WEEKLY;BYDAY=MO" }
        series_id: { type: [string, "null"], format: uuid }
        occurrence_on: { type: [string, "null"], format: date }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskStatus:
      enum: [inbox, next, waiting, someday, done, cancelled]
    TaskFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: string, maxLength: 20000 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        context: { type: [string, "null"], example: "@home" }
        scheduled_on: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        recurrence: { type: [string, "null"], example: "FREQ=WEEKLY;BYDAY=MO,TH" }
    Checkin:
      type: object
      required: [kind, day, note, created_at]
      properties:
        kind: { enum: [daily, weekly, monthly] }
        day: { type: string, format: date }
        note: { type: string }
        created_at: { type: string, format: date-time }
    SearchHit:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          required: [rank, snippet]
          properties:
            rank: { type: number }
            snippet: { type: string, description: "A short excerpt; matched words are wrapped in U+0002 … U+0003." }
    Note:
      type: object
      required: [id, path, title, kind, para, tags, hash, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string, example: "Zettel/permanent/proofs.md" }
        title: { type: string, description: "Front-matter title, else the first heading, else the file name." }
        kind: { type: string, description: 'Front-matter type (fleeting, literature, permanent…), or "note".' }
        para: { $ref: "#/components/schemas/NotePara" }
        tags: { type: array, items: { type: string }, description: "From front matter tags: and #tags in the body, lower-cased." }
        hash: { type: string, description: "SHA-256 of the content, hex." }
        content: { type: string, description: "The Markdown exactly as written; omitted from lists." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotePara:
      type: string
      enum: [inbox, projects, areas, resources, archive, other]
      description: PARA category, from the top folder (0-Inbox, 1-Projects…); notes at the root are inbox.
    NotePath:
      type: string
      maxLength: 500
      example: "Zettel/idea.md"
      description: Relative, ending in .md, with no ".." or hidden folders.
    NoteContent:
      type: string
      maxLength: 1000000
    GoalStatus:
      type: string
      enum: [active, achieved, archived]
    Measure:
      type: object
      required: [unit, start, target, current]
      additionalProperties: false
      properties:
        unit: { type: string, minLength: 1, maxLength: 40, example: km }
        start: { type: number }
        target: { type: number, description: Must differ from start; may be below it (e.g. weight). }
        current: { type: number }
    Progress:
      type: object
      required: [percent, method, done, total, summary]
      properties:
        percent: { type: [integer, "null"], minimum: 0, maximum: 100, description: "Rounded down; null when there is nothing to measure." }
        method:
          enum: [measure, items, none]
          description: "measure: how far current moved from start to target. items: done milestones and linked tasks over all of them. none: nothing to measure yet."
        done: { type: integer }
        total: { type: integer }
        summary: { type: string, example: "3 of 5 milestones and linked tasks done" }
    Milestone:
      type: object
      required: [id, goal_id, title, due_on, done_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        goal_id: { type: string, format: uuid }
        title: { type: string }
        due_on: { type: [string, "null"], format: date }
        done_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MilestoneFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        due_on: { type: [string, "null"], format: date }
        done: { type: boolean }
    Goal:
      type: object
      required: [id, title, outcome, status, target_date, measure, progress, milestones, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        outcome: { type: string, description: What will be true when the goal is reached. }
        status: { $ref: "#/components/schemas/GoalStatus" }
        target_date: { type: [string, "null"], format: date }
        measure:
          oneOf:
            - $ref: "#/components/schemas/Measure"
            - type: "null"
        progress: { $ref: "#/components/schemas/Progress" }
        milestones: { type: array, items: { $ref: "#/components/schemas/Milestone" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GoalFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        outcome: { type: string, maxLength: 20000 }
        status: { $ref: "#/components/schemas/GoalStatus" }
        target_date: { type: [string, "null"], format: date }
        measure:
          oneOf:
            - $ref: "#/components/schemas/Measure"
            - type: "null"
    CalendarEvent:
      type: object
      required: [date, type, kind, id, title, done]
      properties:
        date: { type: string, format: date }
        type: { enum: [task, goal, milestone] }
        kind: { enum: [scheduled, due, target, milestone] }
        id: { type: string, format: uuid }
        title: { type: string }
        done: { type: boolean }
        goal_id: { type: string, format: uuid, description: The milestone's goal. }
    CalendarFeed:
      type: object
      required: [id, name, types, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        types: { type: array, items: { enum: [task, goal, milestone] } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    AgentStatus:
      type: object
      required: [available, reason, provider, monthly_budget_cents, spent_micros]
      properties:
        available: { type: boolean }
        provider: { type: [string, "null"], description: The provider runs would use. }
        reason: { type: [string, "null"], enum: [not_configured, no_consent, budget_exhausted, null] }
        monthly_budget_cents: { type: integer }
        spent_micros: { type: integer, description: "US dollars × 1,000,000 spent this calendar month (UTC)." }
    AgentRun:
      type: object
      description: The audit record of a run. It never contains prompt, reply, or tool input text.
      required: [id, agent, skill_version, model, status, tools_called, proposals, input_tokens, output_tokens, cost_micros, error, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        agent: { type: string }
        skill_version: { type: string }
        model: { type: string }
        status: { enum: [running, completed, budget_exhausted, step_limit, refused, failed] }
        tools_called: { type: array, items: { type: string }, example: ["list_tasks", "update_task:proposed", "denied:web_fetch"] }
        proposals: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_micros: { type: integer }
        error: { type: [string, "null"], enum: [provider_error, timeout, interrupted, internal, null] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    Proposal:
      type: object
      required: [id, run_id, agent, tool, input, summary, reason, status, created_at, decided_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        agent: { type: string }
        tool: { type: string }
        input: { type: object, description: "The validated change, applied as-is on approval." }
        summary: { type: string, example: "Change task “Call the plumber”: status → next, context → @phone" }
        reason: { type: string }
        status: { enum: [pending, approved, rejected, failed] }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
    HabitFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500, description: "The action: “Read one page”." }
        cue: { type: string, maxLength: 500 }
        craving: { type: string, maxLength: 500 }
        reward: { type: string, maxLength: 500 }
        stack_after: { type: string, maxLength: 500, example: "After I pour my coffee" }
        two_minute: { type: string, maxLength: 500, example: "Put on my running shoes" }
        days: { type: array, minItems: 1, maxItems: 7, items: { type: integer, minimum: 1, maximum: 7 }, description: "ISO weekdays in the user's time zone, 1 = Monday." }
        status: { enum: [active, paused, archived] }
    Habit:
      type: object
      required: [id, title, cue, craving, reward, stack_after, two_minute, days, status, state, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        cue: { type: string }
        craving: { type: string }
        reward: { type: string }
        stack_after: { type: string }
        two_minute: { type: string }
        days: { type: array, items: { type: integer } }
        status: { enum: [active, paused, archived] }
        state:
          type: object
          required: [today, scheduled_today, checked_in, streak, recovery]
          properties:
            today: { type: string, format: date }
            scheduled_today: { type: boolean }
            checked_in: { type: [string, "null"], enum: [done, two_minute, skipped, null] }
            streak: { type: integer, description: "Scheduled days kept in a row, up to 366; planned skips neither count nor break it." }
            recovery:
              oneOf:
                - type: "null"
                - type: object
                  required: [missed, message]
                  properties:
                    missed: { type: integer, description: Scheduled days missed in a row (up to 7). }
                    message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HabitCheckin:
      type: object
      required: [day, status, note, created_at]
      properties:
        day: { type: string, format: date }
        status: { enum: [done, two_minute, skipped] }
        note: { type: string }
        created_at: { type: string, format: date-time }
    ProviderSettings:
      type: object
      required: [provider, model, base_url, has_key, input_price, output_price]
      properties:
        provider: { type: string }
        model: { type: string }
        base_url: { type: [string, "null"] }
        has_key: { type: boolean }
        input_price: { type: [number, "null"] }
        output_price: { type: [number, "null"] }
    Project:
      type: object
      required: [id, title, description, status, wip_limit, docs_folder, done, total, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { enum: [active, on_hold, done, archived] }
        wip_limit: { type: [integer, "null"] }
        docs_folder: { type: string, example: "1-Projects/axon" }
        done: { type: integer, description: Cards whose task is done. }
        total: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 20000 }
        status: { enum: [active, on_hold, done, archived] }
        wip_limit: { type: [integer, "null"], minimum: 1, maximum: 50 }
        docs_folder: { type: string, maxLength: 300 }
    Card:
      type: object
      required: [task_id, title, status, due_on, column, kind, parent_id, children_done, children]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        due_on: { type: [string, "null"], format: date }
        column: { enum: [backlog, todo, doing, done] }
        kind: { enum: [epic, issue, subtask] }
        parent_id: { type: [string, "null"], format: uuid }
        children_done: { type: integer }
