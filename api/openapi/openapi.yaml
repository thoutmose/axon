      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: types
          in: query
          description: Comma-separated subset of task, goal, milestone (default all).
          schema: { type: string, example: "task,milestone" }
      responses:
        "200":
          description: Events, oldest first. Cancelled tasks and archived goals are left out.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/calendar-feeds:
    get:
      tags: [dashboard]
      operationId: listCalendarFeeds
      summary: iCal feeds of this account
      security: [{ session: [] }]
      responses:
        "200":
          description: Feeds (their URLs are only shown at creation).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CalendarFeed" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [dashboard]
      operationId: createCalendarFeed
