  /v1/media:
    get:
      tags: [media]
      operationId: listMedia
      summary: Films, series, and books, most recently changed first
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [film, series, book] } }
        - { name: status, in: query, schema: { type: string, enum: [want, doing, done, dropped] } }
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MediaItem" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [media]
      operationId: createMedia
      summary: Add a film, series, or book, by hand or from a catalogue entry
      description: "With catalog, the entry's details and cover are fetched and copied to Axon; fields you send win over the catalogue's."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MediaFields"
                - type: object
                  required: [kind]
                  properties:
                    catalog:
                      type: object
                      required: [source, source_id]
                      additionalProperties: false
                      properties:
                        source: { enum: [tmdb, openlibrary] }
                        source_id: { type: string, maxLength: 100 }
      responses:
        "201":
          description: The new item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/media/catalogs:
    get:
      tags: [media]
      operationId: getMediaCatalogs
      summary: Which catalogues this server can search
      responses:
        "200":
          description: Books come from Open Library; films and series need a TMDB key on the server.
          content:
            application/json:
              schema:
                type: object
                required: [books, films_and_series, consented]
                properties:
                  books: { type: boolean }
                  films_and_series: { type: boolean }
                  consented: { type: boolean, description: "Whether you allowed lookups (consent external_metadata)." }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/media/search:
    get:
      tags: [media]
      operationId: searchMediaCatalog
      summary: Search Open Library (books) or TMDB (films and series)
      description: "Needs the external_metadata consent, since the search text goes to the provider. Results are cached for a week. Each person has 30 lookups a minute."
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [film, series, book] } }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        "200":
          description: Catalogue entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MediaCandidate" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/media/recommendations:
    get:
      tags: [media]
      operationId: getMediaRecommendations
      summary: What to watch or read next from your own list, each with its reasons
      description: "No AI and no catalogue: reasons come from what you rated 8 or more and what you started."
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [film, series, book] } }
      responses:
        "200":
          description: Up to 10 recommendations, best first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [item, score, reasons]
                      properties:
                        item: { $ref: "#/components/schemas/MediaItem" }
                        score: { type: integer }
                        reasons: { type: array, minItems: 1, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/media/covers/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [media]
      operationId: getMediaCover
      summary: A cover copied from a catalogue, served by Axon
      responses:
        "200":
          description: The image.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/media/covers/find:
    post:
      tags: [media]
      operationId: findMediaCovers
      summary: Give covers to items that have none
      description: >-
        Looks up to 20 of the person's items without a cover, oldest first, in Open Library (books) and TMDB (films and
        series, when set up), and copies the cover of the same work: same title, and the same author or year when both
        are known. Needs the external_metadata consent; uses the person's lookup quota, cached lookups included. A run takes at most about 12 seconds.
      responses:
        "200":
          description: How many items were looked up and how many got a cover.
          content:
            application/json:
              schema:
                type: object
                required: [checked, found, more, films_and_series]
                additionalProperties: false
                properties:
                  checked: { type: integer, minimum: 0 }
                  found: { type: integer, minimum: 0 }
                  more: { type: boolean, description: The run stopped at its time budget or the lookup quota; run it again for the rest. }
                  films_and_series: { type: boolean, description: Whether films and series can be looked up (TMDB set up). }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
