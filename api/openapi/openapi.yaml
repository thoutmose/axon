        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csv, date_column, amount_column]
              properties:
                csv: { type: string, maxLength: 4000000 }
                account_id: { type: [string, "null"], format: uuid }
                delimiter: { type: string, maxLength: 1, example: ";" }
                date_format: { enum: [YYYY-MM-DD, DD/MM/YYYY, MM/DD/YYYY, DD.MM.YYYY] }
                has_header: { type: boolean }
                date_column: { type: integer, minimum: 0 }
                amount_column: { type: integer, minimum: 0, description: "Negative amounts are expenses, positive ones income." }
                payee_column: { type: [integer, "null"], minimum: 0 }
                note_column: { type: [integer, "null"], minimum: 0 }
      responses:
        "200":
          description: What the import did.
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped, problems]
                properties:
                  created: { type: integer }
                  skipped: { type: integer, description: Rows imported before. }
                  problems: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
