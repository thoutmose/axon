      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [url], additionalProperties: false, properties: { url: { type: string } } } } }
      responses:
        "200":
          description: The feed found.
          content:
            application/json:
              schema:
                type: object
                required: [url, title, site_url, recent, entries]
                properties:
                  url: { type: string }
                  title: { type: string }
                  site_url: { type: string }
                  recent: { type: array, items: { type: string } }
                  entries: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/watch/sources/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [watch]
      operationId: updateWatchSource
      summary: "Change a source's name, topics, schedule (cron, in your time zone), or switches"
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WatchSourceInput" } } }
      responses:
        "200": { description: Changed., content: { application/json: { schema: { $ref: "#/components/schemas/WatchSource" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [watch]
      operationId: unfollowWatchSource
      summary: "Stop following a source; its news stay unless items=delete"
      parameters:
        - { name: items, in: query, schema: { type: string, enum: [keep, delete], default: keep } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/watch/sources/{id}/fetch:
    post:
      tags: [watch]
      operationId: fetchWatchSource
      summary: "Fetch a source now, whatever its schedule"
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: What it brought; error is empty when it worked.
          content:
            application/json:
              schema:
                type: object
                required: [source, stats, error]
                properties:
                  source: { $ref: "#/components/schemas/WatchSource" }
                  stats: { $ref: "#/components/schemas/WatchFetchStats" }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/watch/import:
    post:
      tags: [watch]
      operationId: importWatchSources
      summary: "Follow sources from a normalised CSV (url,title,topics,schedule,full_text) or an OPML file (Feedly, FreshRSS, Inoreader…)"
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, opml] } }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string } }
          text/x-opml: { schema: { type: string } }
      responses:
        "200": { description: What was imported., content: { application/json: { schema: { $ref: "#/components/schemas/WatchImportResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/watch/import/freshrss:
    post:
      tags: [watch]
      operationId: importFreshRSS
      summary: "Follow the subscriptions of a FreshRSS account (its Google Reader API); the password is used once and not stored"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, user, password]
              additionalProperties: false
              properties:
                url: { type: string, example: "https://rss.example.org" }
                user: { type: string }
                password: { type: string, description: "The API password from FreshRSS: Profile → API management." }
      responses:
        "200": { description: What was imported., content: { application/json: { schema: { $ref: "#/components/schemas/WatchImportResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/watch/sources.opml:
    get:
      tags: [watch]
      operationId: exportWatchOPML
      summary: "Your sources as OPML, folders by topic, for any reader"
      responses:
        "200": { description: OPML 2.0., content: { text/x-opml: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/watch/items:
    get:
      tags: [watch]
      operationId: listWatchItems
      summary: "News, newest first, each stored once however many sources carried it"
      parameters:
        - { $ref: "#/components/parameters/WatchStatus" }
        - { $ref: "#/components/parameters/WatchKind" }
        - { $ref: "#/components/parameters/WatchSource" }
        - { $ref: "#/components/parameters/WatchTopic" }
        - { $ref: "#/components/parameters/WatchLabel" }
        - { $ref: "#/components/parameters/WatchQuery" }
        - { $ref: "#/components/parameters/WatchFrom" }
        - { $ref: "#/components/parameters/WatchTo" }
        - { name: before, in: query, description: "Paging: published before this time.", schema: { type: string } }
        - { $ref: "#/components/parameters/WatchOutliers" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: News.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/WatchItem" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/watch/items/read:
    post:
      tags: [watch]
      operationId: markWatchItemsRead
      summary: "Mark every unread item matching the filters as read"
      parameters:
        - { $ref: "#/components/parameters/WatchSource" }
        - { $ref: "#/components/parameters/WatchTopic" }
        - { $ref: "#/components/parameters/WatchLabel" }
        - { $ref: "#/components/parameters/WatchQuery" }
        - { $ref: "#/components/parameters/WatchFrom" }
        - { $ref: "#/components/parameters/WatchTo" }
      responses:
        "200": { description: How many., content: { application/json: { schema: { type: object, required: [marked], properties: { marked: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/watch/items/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [watch]
      operationId: getWatchItem
      summary: "One item with its text, and as a feed note (Markdown)"
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                type: object
                required: [item, note]
                properties:
                  item: { $ref: "#/components/schemas/WatchItem" }
                  note: { type: string, description: "The feed-note template filled in." }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [watch]
      operationId: updateWatchItem
      summary: "Mark read, save, or archive an item, or set its labels"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [unread, read, saved, archived] }
                labels: { type: array, items: { type: string, maxLength: 60 }, maxItems: 20 }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/watch/items/{id}/transcript:
    post:
      tags: [watch]
      operationId: transcribeWatchItem
      summary: Read a YouTube video's words now, and analyse the item again with them
      description: "From YouTube's captions (the author's in the spoken language, else the automatic ones), else, when the operator set AXON_WHISPER_URL, from the video's audio transcribed by that Whisper server. A video read once is not asked for again. Refused to the shared demo."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The item, with its transcript in its content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchItem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /v1/watch/items/{id}/keep:
    post:
      tags: [watch]
      operationId: keepWatchItem
      summary: "Keep an item as a feed note in Feeds/, linked to it"
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: The note., content: { application/json: { schema: { type: object, required: [note_id], properties: { note_id: { type: string, format: uuid } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/watch/stats:
    get:
      tags: [watch]
      operationId: watchStats
      summary: "The tech watch at a glance: sources by health, news by status, per day, and the labels in use"
      responses:
        "200": { description: The overview., content: { application/json: { schema: { $ref: "#/components/schemas/WatchStats" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/watch/graph:
    get:
      tags: [watch]
      operationId: watchGraph
      summary: "The knowledge graph of the news (not of your notes): concepts, how strongly they go together, their communities, and a summary of each"
      parameters:
        - { $ref: "#/components/parameters/WatchSource" }
        - { $ref: "#/components/parameters/WatchTopic" }
        - { name: from, in: query, description: "Published from (2026-10-14 or RFC 3339); 30 days before to by default.", schema: { type: string } }
        - { name: to, in: query, description: "Published before; now by default.", schema: { type: string } }
        - { name: fringe, in: query, description: "1 to keep concepts with no strong link and the news set aside as outliers.", schema: { type: string, enum: ["0", "1"] } }
        - { name: min, in: query, description: "Weakest link kept (NPMI), above 0 and at most 1.", schema: { type: number, default: 0.15 } }
      responses:
        "200": { description: The graph., content: { application/json: { schema: { $ref: "#/components/schemas/WatchGraph" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/watch/export:
    get:
      tags: [watch]
      operationId: exportWatch
      summary: "Download the news a filter selects (by kind, source, topic, label, words, status, and period), each export saying it comes from Axon Project"
      parameters:
        - { $ref: "#/components/parameters/WatchFormat" }
        - { $ref: "#/components/parameters/WatchStatus" }
        - { $ref: "#/components/parameters/WatchKind" }
        - { $ref: "#/components/parameters/WatchSource" }
        - { $ref: "#/components/parameters/WatchTopic" }
        - { $ref: "#/components/parameters/WatchLabel" }
        - { $ref: "#/components/parameters/WatchQuery" }
        - { $ref: "#/components/parameters/WatchFrom" }
        - { $ref: "#/components/parameters/WatchTo" }
        - { $ref: "#/components/parameters/WatchOutliers" }
      responses:
        "200":
          description: "The file: CSV, OpenDocument spreadsheet, Markdown, a zip of feed notes, JSON, or PDF; at most 5,000 news, newest first."
          content:
            text/csv: { schema: { type: string } }
            application/vnd.oasis.opendocument.spreadsheet: { schema: { type: string, format: binary } }
            text/markdown: { schema: { type: string } }
            application/zip: { schema: { type: string, format: binary } }
            application/json: { schema: { type: object } }
            application/pdf: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/watch/podcast/voices:
    get:
      tags: [watch]
      operationId: listPodcastVoices
      summary: The natural voices of the operator's speech server (AXON_TTS_URL), if one is set
      description: "A server that speaks the OpenAI speech API, such as Kokoro-FastAPI (EP-132). Kokoro's names say the language: a and b English, f French, e Spanish, i Italian, p Portuguese, j Japanese, z Chinese, h Hindi."
      responses:
        "200":
          description: Whether a server is set, and its voices.
          content:
            application/json:
              schema:
                type: object
                required: [available, voices]
                properties:
                  available: { type: boolean }
                  voices:
                    type: array
                    items:
                      type: object
                      required: [id, lang]
                      properties:
                        id: { type: string, example: af_heart }
                        lang: { type: string, description: "en, fr…, or empty when the name does not say.", example: en }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/watch/podcast/speech:
    post:
      tags: [watch]
      operationId: speakPodcastPart
      summary: Speak one part of an episode with a natural voice, as MP3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, voice]
              properties:
                text: { type: string, minLength: 1, maxLength: 3000 }
                voice: { type: string, maxLength: 64 }
                speed: { type: number, minimum: 0.5, maximum: 2, default: 1 }
      responses:
        "200":
          description: The spoken part.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /v1/watch/shares:
    get:
      tags: [watch]
      operationId: listWatchShares
      summary: Your links to a selection of the news
      responses:
        "200":
          description: Links, newest first.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/WatchShare" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [watch]
      operationId: createWatchShare
      summary: "Share a selection of the news with a read-only link (signed-in session only; audited)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100, description: "Who or what it is for." }
                query: { type: string, description: "The filter as a query string, e.g. label=ai&from=2026-10-01. Only status, kind, source, topic, label, q, from, and to are kept." }
                days: { type: integer, minimum: 1, maximum: 365, default: 30, description: "How long the link lives." }
      responses:
        "201":
          description: Created. The path holds the link's secret and is not shown again.
          content:
            application/json:
              schema:
                type: object
                required: [share, path]
                properties:
                  share: { $ref: "#/components/schemas/WatchShare" }
                  path: { type: string, description: "/shared/watch/<token> on this server." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/watch/shares/{id}:
    delete:
      tags: [watch]
      operationId: deleteWatchShare
      summary: Revoke a link at once
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/shared/watch/{token}:
    get:
      tags: [watch]
      operationId: getSharedWatch
      summary: "A shared selection of news, for anyone with the link: what the sources published, never the owner's status or notes"
      security: []
      parameters:
        - { name: token, in: path, required: true, description: The secret part of the link., schema: { type: string } }
        - { name: format, in: query, description: "A download instead of the page's data.", schema: { type: string, enum: [csv, ods, md, zip, json, pdf] } }
      responses:
        "200":
          description: The page's data (the newest 200 news), or the file.
          content:
            application/json:
              schema:
                type: object
                description: "The page's data; with format=json, the export instead."
                properties:
                  name: { type: string }
                  description: { type: string }
                  count: { type: integer }
                  generated_at: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
                  attribution: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [title, url, source_title, author, published_at, summary, kind, labels, reading_minutes]
                      properties:
                        title: { type: string }
                        url: { type: string }
                        source_title: { type: string }
                        author: { type: string }
                        published_at: { type: string, format: date-time }
                        summary: { type: string }
                        kind: { type: string, enum: [article, video, podcast] }
                        labels: { type: array, items: { type: string } }
                        reading_minutes: { type: integer }
            text/csv: { schema: { type: string } }
            application/vnd.oasis.opendocument.spreadsheet: { schema: { type: string, format: binary } }
            text/markdown: { schema: { type: string } }
            application/zip: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/audiobookshelf:
    get:
      tags: [watch]
      operationId: getAudiobookshelf
      summary: Your Audiobookshelf server, without its token
      responses:
        "200":
          description: Its state; connected is false without one.
          content:
            application/json:
              schema:
                type: object
                required: [connected, url, synced_at, error, shows]
                properties:
                  connected: { type: boolean }
                  url: { type: string }
                  synced_at: { type: [string, "null"], format: date-time }
                  error: { type: string, description: "The last sync's error, if any." }
                  shows: { type: integer, description: "Shows followed in the tech watch." }
        "401": { $ref: "#/components/responses/Problem" }
    put:
      tags: [watch]
      operationId: connectAudiobookshelf
      summary: Connect your Audiobookshelf, then follow its podcasts in the tech watch
      description: "The address and token are checked with the server; the token is sealed (AXON_ENCRYPTION_KEY) and never shown again. A server on a private network needs the operator's AXON_CALENDAR_PRIVATE=1. Refused to the shared demo."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string, maxLength: 500, example: "https://abs.example.org" }
                token: { type: string, maxLength: 2000, description: "An API token from Audiobookshelf; empty keeps the one saved." }
      responses:
        "200":
          description: Connected and synced.
          content:
            application/json:
              schema:
                type: object
                required: [connected, url, synced_at, error, shows]
                properties:
                  connected: { type: boolean }
                  url: { type: string }
                  synced_at: { type: [string, "null"], format: date-time }
                  error: { type: string, description: "The last sync's error, if any." }
                  shows: { type: integer, description: "Shows followed in the tech watch." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [watch]
      operationId: disconnectAudiobookshelf
      summary: Forget your Audiobookshelf; its shows are no longer followed, their episodes stay
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/audiobookshelf/sync:
    post:
      tags: [watch]
      operationId: syncAudiobookshelf
      summary: Follow every show of your podcast libraries, and read new episodes
      responses:
        "200":
          description: What the sync brought.
          content:
            application/json:
              schema:
                type: object
                required: [shows, new_shows, new_episodes]
                properties:
                  shows: { type: integer }
                  new_shows: { type: integer }
                  new_episodes: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /v1/watch/podcast:
    get:
      tags: [watch]
      operationId: watchPodcast
      summary: "The script of a podcast episode of the news, from your podcast settings unless the query says otherwise; read aloud by your device or a speech server. Off until you turn it on."
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [briefing, digest, deep] }, description: "A sentence a story, a few, or by topic with more." }
        - { name: lang, in: query, schema: { type: string, enum: [en, fr] }, description: "The language of the spoken links; the news keep theirs." }
        - { name: minutes, in: query, schema: { type: integer, minimum: 3, maximum: 30 } }
        - { name: days, in: query, schema: { type: integer, enum: [1, 7] } }
        - { $ref: "#/components/parameters/WatchTopic" }
      responses:
        "200": { description: The episode., content: { application/json: { schema: { $ref: "#/components/schemas/WatchEpisode" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/vault/source:
    get:
      tags: [vault]
      operationId: getVaultSource
      summary: "Where your Markdown vault lives: null when notes live in Axon only (the default)"
      responses:
        "200":
          description: The vault server, or null.
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/VaultSource"
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [vault]
      operationId: putVaultSource
      summary: "Name the server and folder that hold your vault, and get a one-time pairing code (30 min) with the commands that use it"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, dir]
              additionalProperties: false
              properties:
                host: { type: string, maxLength: 100, example: srv-secondbrain }
                dir: { type: string, maxLength: 500, example: ~/SecondBrain, description: "A full path, starting with / or ~/." }
                scaffold: { type: boolean, default: true, description: "When the folder holds no notes yet, start it with the folder structure and templates." }
      responses:
        "200":
          description: The vault server and how to set it up.
          content:
            application/json:
              schema:
                type: object
                required: [source, setup]
                properties:
                  source: { $ref: "#/components/schemas/VaultSource" }
                  setup:
                    type: object
                    required: [code, expires_at, install, docker]
                    properties:
                      code: { type: string, example: ABCD-EFGH }
                      expires_at: { type: string, format: date-time }
                      install: { type: string, description: "One line for the server's shell: downloads axon, pairs, installs a user service." }
                      docker: { type: string, description: "The same with the axon-api image." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [vault]
      operationId: deleteVaultSource
      summary: "Stop using the vault server and revoke its token; the notes stay in Axon, the files on the server"
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/vault/pair:
    post:
      tags: [vault]
      operationId: pairVault
      summary: "A vault server exchanges its one-time code for a write token (used by axon notes-sync -pair)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string }
                host: { type: string, description: "The server's host name, to name the token." }
                empty: { type: boolean, description: "The folder holds no notes yet." }
      responses:
        "200":
          description: The token, shown once, and what to create in an empty vault.
          content:
            application/json:
              schema:
                type: object
                required: [token, dir, folders, scaffold, expires_at]
                properties:
                  token: { type: string }
                  dir: { type: string }
                  folders: { type: array, items: { type: string } }
                  scaffold: { type: array, items: { type: string }, description: "Notes added to Axon for the first sync to write." }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/vault/heartbeat:
    post:
      tags: [vault]
      operationId: vaultHeartbeat
      summary: "A vault server says how its last sync went (sent by notes-sync after each run and every 5 minutes)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultReport" }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/vault/scaffold:
    post:
      tags: [vault]
      operationId: scaffoldVault
      summary: "Add the Home note and the built-in templates where their paths are free; the folders are made by the vault server"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: What was added.
          content:
            application/json:
              schema:
                type: object
                required: [added, folders]
                properties:
                  added: { type: array, items: { type: string } }
                  folders: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/vault/install.sh:
    get:
      tags: [vault]
      operationId: vaultInstallScript
      summary: "The setup script the one-line install runs on the vault server"
      security: []
      responses:
        "200":
          description: A POSIX shell script.
          content:
            text/plain:
              schema: { type: string }
  /v1/vault/agent:
    get:
      tags: [vault]
      operationId: vaultAgent
      summary: "This Axon's own program, for a vault server of the same system and architecture"
      security: []
      parameters:
        - { name: os, in: query, required: true, schema: { type: string, example: linux } }
        - { name: arch, in: query, required: true, schema: { type: string, example: amd64 } }
      responses:
        "200":
          description: The axon executable.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: axon_session
      description: Browser session; writes also need a matching Origin header.
    token:
      type: http
      scheme: bearer
      description: Personal access token (axon_…); read or write scope.

  parameters:
    WatchStatus: { name: status, in: query, schema: { type: string, enum: [unread, read, saved, archived, all] }, description: "Empty: everything but archived." }
    WatchSource: { name: source, in: query, schema: { type: string, format: uuid } }
    WatchTopic: { name: topic, in: query, schema: { type: string, format: uuid } }
    WatchLabel: { name: label, in: query, schema: { type: string } }
    WatchQuery: { name: q, in: query, description: "Words in the title or summary.", schema: { type: string } }
    WatchFrom: { name: from, in: query, description: "Published from (2026-10-14 or RFC 3339).", schema: { type: string } }
    WatchTo: { name: to, in: query, description: "Published before.", schema: { type: string } }
    WatchKind: { name: kind, in: query, description: "Articles, videos (YouTube, Vimeo), or podcast episodes (an audio enclosure).", schema: { type: string, enum: [article, video, podcast] } }
    WatchFormat: { name: format, in: query, required: true, schema: { type: string, enum: [csv, ods, md, zip, json, pdf] } }
    WatchOutliers: { name: outliers, in: query, description: "1 to include items flagged as outliers.", schema: { type: string, enum: ["0", "1"] } }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    After:
      name: after
      in: query
      description: next_cursor from the previous page.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last GET.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Any unique string (e.g. a UUID); retries with the same key and body replay the first response.
      schema: { type: string, maxLength: 200 }

  headers:
    ETag:
      description: Current version, for If-Match.
      schema: { type: string }

  requestBodies:
    WatchTopicInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name: { type: string, maxLength: 80 }
              keywords: { type: array, items: { type: string, maxLength: 80 }, maxItems: 50, description: "Words or phrases; thesaurus synonyms count too." }
    ChannelInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [slack, discord, teams, telegram, ntfy, webhook], description: "Required to create; a channel keeps its kind." }
              name: { type: string, maxLength: 100 }
              config:
                type: object
                additionalProperties: false
                description: "Write-only. Slack: webhook_url, or bot_token (xoxb-) and app_token (xapp-). Discord: webhook_url or bot_token. Teams: webhook_url. Telegram: bot_token. ntfy: server, topic, token. Webhook: webhook_url, secret."
                properties:
                  webhook_url: { type: string, maxLength: 2000 }
                  bot_token: { type: string }
                  app_token: { type: string }
                  server: { type: string }
                  topic: { type: string }
                  token: { type: string }
                  secret: { type: string }
              digests: { type: array, items: { type: string, enum: [daily, weekly, monthly] } }
              reminders: { type: boolean }
              enabled: { type: boolean }
    WebAuthnCredential:
      required: true
      description: The browser's PublicKeyCredential, JSON-encoded (WebAuthn Level 3 toJSON()).
      content:
        application/json:
          schema: { type: object }
    TOTPCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            additionalProperties: false
            properties:
              code: { type: string }

  responses:
    DailyNeeds:
      description: The profile (null until saved) and the needs (null without a profile).
      content:
        application/json:
          schema:
            type: object
            required: [profile, needs]
            properties:
              profile: { oneOf: [{ $ref: "#/components/schemas/HealthProfile" }, { type: "null" }] }
              needs: { oneOf: [{ $ref: "#/components/schemas/DailyNeeds" }, { type: "null" }] }
    ChannelSaved:
      description: The channel, and for a bot not linked yet the code to send it.
      content:
        application/json:
          schema:
            type: object
            required: [channel]
            properties:
              channel: { $ref: "#/components/schemas/Channel" }
              link_code: { type: string, example: ABCD-EFGH }
    Problem:
      description: RFC 9457 problem document.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    WebAuthnOptions:
      description: Options to pass to navigator.credentials (publicKey member).
      content:
        application/json:
          schema:
            type: object
            required: [publicKey]
            properties:
              publicKey: { type: object }
    SyncConflict:
      description: The note changed in Axon since the client last synced; keep both versions.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                required: [current]
                properties:
                  current:
                    oneOf:
                      - $ref: "#/components/schemas/Note"
                      - type: "null"
                    description: Axon's version, or null when the note was deleted in Axon.
    FileConflict:
      description: The file changed in Axon since the client last synced; keep both versions.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                required: [current]
                properties:
                  current:
                    oneOf:
                      - $ref: "#/components/schemas/NoteFile"
                      - type: "null"
                    description: Axon's version, or null when the file was deleted in Axon.
    Restored:
      description: Put back.
      content:
        application/json:
          schema:
            type: object
            required: [entity_id, type]
            properties:
              entity_id: { type: string, format: uuid }
              type: { type: string }
    SignedIn:
      description: Signed in; the session cookie is set.
      content:
        application/json:
          schema:
            type: object
            required: [display_name]
            properties:
              display_name: { type: string }

  schemas:
    WatchTopic:
      type: object
      required: [id, name, keywords]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        keywords: { type: array, items: { type: string } }
    WatchSourceInput:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, description: "To follow: a feed, a site, a Medium author, a Substack, a YouTube channel or playlist, a GitHub repository, a subreddit." }
        title: { type: string, maxLength: 200 }
        topic_ids: { type: array, items: { type: string, format: uuid } }
        schedule: { type: string, example: "0 0 * * *", description: "Cron (minute hour day month weekday) in your time zone, or @daily, @hourly, @weekly; at least 15 minutes apart. Midnight by default." }
        enabled: { type: boolean }
        full_text: { type: boolean, description: "Read each article's page when the feed has an excerpt only." }
    WatchSource:
      type: object
      required: [id, url, site_url, title, topic_ids, schedule, enabled, full_text, origin, next_fetch_at, last_fetched_at, last_ok_at, last_error, failures, created_at, items, items_week, merged, health]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        site_url: { type: string }
        title: { type: string }
        topic_ids: { type: array, items: { type: string, format: uuid } }
        schedule: { type: string }
        enabled: { type: boolean }
        full_text: { type: boolean }
        origin: { type: string, enum: [manual, csv, opml, freshrss, agent, audiobookshelf] }
        next_fetch_at: { type: string, format: date-time }
        last_fetched_at: { type: [string, "null"], format: date-time }
        last_ok_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
        failures: { type: integer }
        created_at: { type: string, format: date-time }
        items: { type: integer }
        items_week: { type: integer }
        merged: { type: integer, description: "Stories it also carried, stored once from another source." }
        health: { type: string, enum: [ok, failing, waiting, off] }
    WatchFetchStats:
      type: object
      required: [new, merged, skipped]
      properties:
        new: { type: integer }
        merged: { type: integer, description: "The same story (same link, or nearly the same text) was already stored: this source was added to it." }
        skipped: { type: integer }
    WatchImportResult:
      type: object
      required: [added, existing, failed, topics_created]
      properties:
        added: { type: integer }
        existing: { type: integer }
        topics_created: { type: integer }
        failed:
          type: array
          items: { type: object, required: [line, url, reason], properties: { line: { type: integer }, url: { type: string }, reason: { type: string } } }
    WatchItem:
      type: object
      required: [id, source_id, source_title, url, title, author, published_at, fetched_at, summary, image, audio, lang, words, reading_minutes, keywords, labels, categories, topic_ids, score, outlier, also_in, status, note_id, kind, transcript_source, transcript_lang, source_url]
      properties:
        id: { type: string, format: uuid }
        source_id: { type: [string, "null"], format: uuid }
        source_title: { type: string }
        url: { type: string }
        title: { type: string }
        author: { type: string }
        published_at: { type: string, format: date-time }
        fetched_at: { type: string, format: date-time }
        summary: { type: string }
        content: { type: string, description: "Markdown; only when one item is read." }
        image: { type: string }
        audio: { type: string }
        lang: { type: string }
        words: { type: integer }
        reading_minutes: { type: integer }
        keywords: { type: array, items: { type: string } }
        labels: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        topic_ids: { type: array, items: { type: string, format: uuid } }
        score: { type: number }
        outlier: { type: string, description: "Why it stands apart (too short, mostly links, shouting title), or empty." }
        also_in: { type: array, items: { type: string } }
        status: { type: string, enum: [unread, read, saved, archived] }
        note_id: { type: [string, "null"], format: uuid }
        kind: { type: string, enum: [article, video, podcast] }
        transcript_source: { enum: ["", captions, auto_captions, whisper], description: "Where a video's words came from (EP-123); empty without a transcript." }
        transcript_lang: { type: string, description: "The transcript's language, as YouTube or Whisper gave it." }
        source_url: { type: string, description: "Where the source lives (the channel, the blog, the show), its feed when it gives none; empty once unfollowed (EP-126)." }
    WatchEpisode:
      type: object
      required: [title, lang, format, intro, chapters, outro, words, minutes, from, to]
      properties:
        title: { type: string }
        lang: { type: string }
        format: { type: string }
        intro: { type: string }
        chapters:
          type: array
          items:
            type: object
            required: [title, text, item_id, url, source, topic]
            properties:
              title: { type: string }
              text: { type: string, description: What is read aloud. }
              item_id: { type: [string, "null"], format: uuid }
              url: { type: string }
              source: { type: string }
              topic: { type: string }
        outro: { type: string, description: "Says the episode was put together by Axon Project." }
        words: { type: integer }
        minutes: { type: number, description: At 150 words a minute. }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    WatchShare:
      type: object
      required: [id, name, description, query, expires_at, created_at, last_viewed_at, views]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, description: "The filter, in words." }
        query: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        last_viewed_at: { type: [string, "null"], format: date-time }
        views: { type: integer }
    WatchStats:
      type: object
      required: [sources, items, daily, labels, next_fetch_at]
      properties:
        sources:
          type: object
          required: [total, ok, failing, waiting, off]
          properties: { total: { type: integer }, ok: { type: integer }, failing: { type: integer }, waiting: { type: integer }, off: { type: integer } }
        items:
          type: object
          required: [total, unread, saved, today, week, outliers, merged, articles, videos, podcasts]
          properties: { total: { type: integer }, unread: { type: integer }, saved: { type: integer }, today: { type: integer }, week: { type: integer }, outliers: { type: integer }, merged: { type: integer }, articles: { type: integer }, videos: { type: integer }, podcasts: { type: integer } }
        daily:
          type: array
          items: { type: object, required: [day, count], properties: { day: { type: string, format: date }, count: { type: integer } } }
        labels:
          type: array
          items: { type: object, required: [label, count], properties: { label: { type: string }, count: { type: integer } } }
        next_fetch_at: { type: [string, "null"], format: date-time }
    WatchGraphRef:
      type: object
      required: [id, title]
      properties: { id: { type: string, format: uuid }, title: { type: string } }
    WatchGraph:
      type: object
      required: [nodes, edges, communities, stats]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, kind, label, count, sources, community, rank, trend, fringe, summary, items, related, in_notes, topics, first_seen]
            properties:
              id: { type: string }
              kind: { type: string, enum: [concept] }
              label: { type: string }
              count: { type: integer, description: "News it appears in." }
              sources: { type: integer }
              community: { type: integer, description: "0: no strong link (fringe)." }
              rank: { type: number, description: "PageRank relative to the most central concept." }
              trend: { type: number, description: "Last week against the weeks before: above 1.5 rising, below -1.5 fading." }
              fringe: { type: boolean }
              summary: { type: string, description: "The sentences of its news closest to what they share." }
              items: { type: array, items: { $ref: "#/components/schemas/WatchGraphRef" } }
              related: { type: array, items: { type: string } }
              in_notes: { type: array, description: "Your literature and permanent notes that share the concept.", items: { $ref: "#/components/schemas/WatchGraphRef" } }
              topics: { type: array, items: { type: string } }
              first_seen: { type: string, format: date-time }
        edges:
          type: array
          items:
            type: object
            required: [from, to, together, npmi, reason]
            properties: { from: { type: string }, to: { type: string }, together: { type: integer }, npmi: { type: number }, reason: { type: string } }
        communities:
          type: array
          items: { type: object, required: [id, label, size], properties: { id: { type: integer }, label: { type: string }, size: { type: integer } } }
        stats:
          type: object
          required: [items, outliers, concepts, edges, communities, modularity, bridges]
          properties:
            items: { type: integer }
            outliers: { type: integer }
            concepts: { type: integer }
            edges: { type: integer }
            communities: { type: integer }
            modularity: { type: number }
            bridges: { type: integer }
    Channel:
      type: object
      required: [id, kind, name, target, mode, digests, reminders, enabled, linked, peer_name, link_expires_at, created_at, last_sent_at, last_error]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [slack, discord, teams, telegram, ntfy, webhook] }
        name: { type: string }
        target: { type: string, description: "Where it posts, without the secret part." }
        mode: { type: string, enum: [webhook, bot], description: "bot: also reads your answers once linked (Slack, Discord, Telegram)." }
        digests: { type: array, items: { type: string, enum: [daily, weekly, monthly] } }
        reminders: { type: boolean, description: "Task reminders and the evening nudge too." }
        enabled: { type: boolean }
        linked: { type: boolean }
        peer_name: { type: string, description: "Who the bot answers, once linked." }
        link_expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        last_sent_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
    DigestItem:
      type: object
      required: [id, type, text, url]
      properties:
        n: { type: integer, description: "The number to answer with (\"done 2\")." }
        id: { type: string, format: uuid }
        type: { type: string }
        text: { type: string }
        detail: { type: string }
        url: { type: string }
        late: { type: boolean }
    Digest:
      type: object
      required: [kind, lang, title, greeting, date, label, summary, sections, stats, quote, theme, picture, url]
      properties:
        kind: { type: string, enum: [daily, weekly, monthly] }
        lang: { type: string }
        title: { type: string }
        greeting: { type: string }
        date: { type: string, format: date }
        label: { type: string }
        summary: { type: string }
        sections:
          type: [array, "null"]
          items:
            type: object
            required: [key, emoji, title, items]
            properties:
              key: { type: string }
              emoji: { type: string }
              title: { type: string }
              items: { type: array, items: { $ref: "#/components/schemas/DigestItem" } }
              more: { type: integer }
        stats:
          type: [array, "null"]
          items:
            type: object
            required: [emoji, label, value]
            properties:
              emoji: { type: string }
              label: { type: string }
              value: { type: string }
        quote:
          type: object
          required: [text, author]
          properties:
            text: { type: string, description: "Empty when the person's template leaves the quote out." }
            author: { type: string }
        theme: { type: string }
        picture: { type: boolean, description: "Whether the picture goes with it (the person's template, EP-113)." }
        url: { type: string }
    VaultReport:
      type: object
      additionalProperties: false
      properties:
        host: { type: string }
        notes: { type: integer }
        files: { type: integer }
        pushed: { type: integer }
        pulled: { type: integer }
        deleted: { type: integer }
        conflicts: { type: array, items: { type: string } }
        error: { type: string }
    VaultSource:
      type: object
      required: [host, dir, scaffold, status, pair_expires_at, paired_at, paired_host, last_seen_at, token_expires_at, last_report]
      properties:
        host: { type: string }
        dir: { type: string }
        scaffold: { type: boolean }
        status: { type: string, enum: [waiting, connected, silent, failing], description: "waiting: not paired yet; silent: no report for 15 minutes; failing: the last sync failed." }
        pair_expires_at: { type: [string, "null"], format: date-time }
        paired_at: { type: [string, "null"], format: date-time }
        paired_host: { type: string }
        last_seen_at: { type: [string, "null"], format: date-time }
        token_expires_at: { type: [string, "null"], format: date-time }
        last_report: { $ref: "#/components/schemas/VaultReport" }
    EmbeddingStatus:
      type: object
      required: [settings, consent, indexed, notes]
      properties:
        settings:
          oneOf:
            - type: object
              required: [provider, base_url, model, has_key, error]
              properties:
                provider: { enum: [local, openai, voyage] }
                base_url: { type: [string, "null"] }
                model: { type: string }
                has_key: { type: boolean }
                error: { type: string, description: "Why the last indexing failed; empty when it worked." }
            - type: "null"
        consent: { type: boolean, description: The ai_embeddings consent. }
        indexed: { type: integer }
        notes: { type: integer }
    Household:
      type: object
      required: [id, name, members, lists]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        members:
          type: array
          items:
            type: object
            required: [user_id, name, owner, joined_at]
            properties:
              user_id: { type: string, format: uuid }
              name: { type: string, description: The member's display name. }
              owner: { type: boolean }
              joined_at: { type: string, format: date-time }
        lists:
          type: array
          items:
            type: object
            required: [id, title, kind, open, items]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              kind: { enum: [shopping, chores, other] }
              open: { type: integer }
              items:
                type: array
                items:
                  type: object
                  required: [id, list_id, title, due_on, assignee, created_by, done_by, done_at, created_at]
                  properties:
                    id: { type: string, format: uuid }
                    list_id: { type: string, format: uuid }
                    title: { type: string }
                    due_on: { type: [string, "null"], format: date }
                    assignee: { type: [string, "null"], format: uuid }
                    created_by: { type: [string, "null"], format: uuid }
                    done_by: { type: [string, "null"], format: uuid }
                    done_at: { type: [string, "null"], format: date-time }
                    created_at: { type: string, format: date-time }
    CalendarSource:
      type: object
      required: [id, name, color, host, fetched_at, error, events]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        host: { type: string, description: "Where the calendar lives; the full address is a secret and never shown again." }
        fetched_at: { type: [string, "null"], format: date-time }
        error: { type: string, description: "Why the last fetch failed; empty when it worked." }
        events: { type: integer }
    LearningPlan:
      type: object
      required: [cards, recall, test, fleeting, palaces, streak_days]
      properties:
        cards:
          type: object
          required: [due, reviews, new, minutes, leeches, retention, reviewed, target]
          properties:
            due: { type: integer, description: What a review now would offer. }
            reviews: { type: integer }
            new: { type: integer, description: "New cards in today's allowance." }
            minutes: { type: integer, description: "Estimated from your own pace." }
            leeches: { type: integer }
            retention: { type: number, description: "Share of known cards remembered over 30 days; 0 with no reviews." }
            reviewed: { type: integer }
            target: { type: number }
        recall:
          type: object
          required: [due, suggested]
          properties:
            due: { type: array, items: { $ref: "#/components/schemas/RecallNote" } }
            suggested: { type: array, items: { $ref: "#/components/schemas/RecallNote" } }
        test:
          type: object
          required: [due, last_at, score]
          properties:
            due: { type: boolean }
            last_at: { type: [string, "null"], format: date-time }
            score: { type: [number, "null"] }
        fleeting: { type: integer, description: "Fleeting notes older than two days, to process." }
        palaces: { type: integer }
        streak_days: { type: integer }
    RecallNote:
      type: object
      required: [id, title, path, kind, due_on, last_score, last_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        path: { type: string }
        kind: { type: string }
        due_on: { type: [string, "null"], format: date }
        last_score: { type: [number, "null"] }
        last_at: { type: [string, "null"], format: date-time }
    PalaceFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: My flat }
        description: { type: string, maxLength: 5000 }
        loci:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 200 }
          example: [Front door, Coat hook, Kitchen sink, Sofa]
    FocusMinutes:
      type: object
      required: [id, title, minutes]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        minutes: { type: integer }
    Certification:
      type: object
      required: [id, name, provider, code, url, status, target_on, exam_on, passed_on, expires_on, validity_months, score, cost_cents, currency, credential_url, notes, skill_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        provider: { type: string }
        code: { type: string }
        url: { type: [string, "null"] }
        status: { enum: [planned, booked, passed, failed] }
        target_on: { type: [string, "null"], format: date }
        exam_on: { type: [string, "null"], format: date }
        passed_on: { type: [string, "null"], format: date }
        expires_on: { type: [string, "null"], format: date }
        validity_months: { type: [integer, "null"] }
        score: { type: string }
        cost_cents: { type: [integer, "null"] }
        currency: { type: string }
        credential_url: { type: [string, "null"] }
        notes: { type: string }
        skill_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Invite:
      type: object
      required: [id, note, household, expires_at, created_at, used_at, used_by_name]
      properties:
        id: { type: string, format: uuid }
        note: { type: string }
        household: { type: boolean }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        used_at: { type: [string, "null"], format: date-time }
        used_by_name: { type: [string, "null"] }
        url: { type: string, description: "The link, only in the answer that creates it." }
    Decision:
      type: object
      required: [id, title, context, choice, expected, probability, decided_on, review_on, happened, outcome, lessons, reviewed_on, due, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        context: { type: string }
        choice: { type: string }
        expected: { type: string }
        probability: { type: number }
        decided_on: { type: string, format: date }
        review_on: { type: string, format: date }
        happened: { type: [boolean, "null"], description: "Null until reviewed." }
        outcome: { type: string }
        lessons: { type: string }
        reviewed_on: { type: [string, "null"], format: date }
        due: { type: boolean, description: "Not reviewed, and its day has come." }
        created_at: { type: string, format: date-time }
    PracticeProblem:
      type: object
      required: [id, title, url, platform, difficulty, topics, language, skill_id, created_at, attempts, solved, due_on]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url: { type: [string, "null"] }
        platform: { enum: [leetcode, codeforces, hackerrank, advent-of-code, exercism, project-euler, overthewire, portswigger, hackthebox, tryhackme, kaggle, other] }
        difficulty: { enum: [easy, medium, hard] }
        topics: { type: array, items: { type: string } }
        language: { type: string }
        skill_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        attempts:
          type: array
          items:
            type: object
            required: [id, "on", outcome, minutes]
            properties:
              id: { type: string, format: uuid }
              "on": { type: string, format: date }
              outcome: { enum: [solved, with_help, not_solved] }
              minutes: { type: [integer, "null"] }
        solved: { type: boolean, description: "Solved unaided at least once." }
        due_on: { type: [string, "null"], format: date, description: "The day to re-solve it: tomorrow after a miss, in 3 days after help, a week after a first unaided solve (easy ones are done), then 2.5 times the last gap until it would pass 90 days." }
    Palace:
      type: object
      required: [id, title, description, loci, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        loci: { type: array, items: { type: string } }
        cards:
          type: array
          items:
            type: object
            required: [id, locus, deck, front, back, mnemonic, has_image]
            properties:
              id: { type: string, format: uuid }
              locus: { type: integer }
              deck: { type: string }
              front: { type: string }
              back: { type: string }
              mnemonic: { type: string }
              has_image: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NoteFile:
      type: object
      required: [path, content_type, size, hash, updated_at]
      properties:
        path: { type: string, example: Attachments/whiteboard-1a2b3c4d.png }
        content_type: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp, image/svg+xml, application/pdf] }
        size: { type: integer, description: Bytes. }
        hash: { type: string, description: "SHA-256 of the bytes, for sync." }
        updated_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Name:
      type: string
      minLength: 1
      maxLength: 100
    Cursor:
      type: [string, "null"]
      description: Pass back as after/before to get the next page; null on the last page.
    RecoveryCodes:
      type: array
      minItems: 10
      maxItems: 10
      items: { type: string, pattern: "^[a-z2-7]{4}-[a-z2-7]{4}-[a-z2-7]{4}-[a-z2-7]{4}$" }
    Me:
      type: object
      required: [id, display_name, timezone, created_at, totp_enabled, passkeys, recovery_codes_remaining, demo, avatar_updated_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        totp_enabled: { type: boolean }
        passkeys: { type: integer }
        recovery_codes_remaining: { type: integer }
        demo: { type: boolean, description: The shared demo account. }
        avatar_updated_at: { type: [string, "null"], format: date-time, description: "When the picture last changed; add it to the avatar URL to refresh caches." }
    Session:
      type: object
      required: [id, user_agent, created_at, last_seen_at, current]
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    Token:
      type: object
      required: [id, name, scope, created_at, last_used_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { enum: [read, write] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, ip, user_agent, details, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        ip: { type: string }
        user_agent: { type: string }
        details: { type: object }
        created_at: { type: string, format: date-time }
    Consent:
      type: object
      required: [id, description, granted, updated_at]
      properties:
        id: { type: string }
        description: { type: string }
        granted: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
    Relation:
      type: object
      required: [name, sources, targets]
      properties:
        name: { type: string }
        sources: { type: array, items: { type: string } }
        targets: { type: array, items: { type: string } }
    Entity:
      type: object
      required: [id, type, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Link:
      type: object
      required: [id, relation, entity, created_at]
      properties:
        id: { type: string, format: uuid }
        relation: { type: string }
        entity: { $ref: "#/components/schemas/Entity" }
        created_at: { type: string, format: date-time }
    Event:
      type: object
      required: [id, actor, entity_type, entity_id, kind, fields, created_at]
      properties:
        id: { type: string, format: uuid }
        actor: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        kind: { enum: [created, updated, deleted, linked, unlinked] }
        fields: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    Task:
      type: object
      required: [id, title, notes, status, context, scheduled_on, due_on, recurrence, series_id, occurrence_on, completed_at, done_from, remind_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        notes: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        context: { type: [string, "null"] }
        scheduled_on: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        recurrence: { type: [string, "null"], description: "RFC 5545 RRULE, e.g. FREQ=WEEKLY;BYDAY=MO" }
        series_id: { type: [string, "null"], format: uuid }
        occurrence_on: { type: [string, "null"], format: date }
        completed_at: { type: [string, "null"], format: date-time }
        done_from: { type: [string, "null"], enum: [inbox, next, doing, waiting, someday, null], description: "The list it was in when it was done or cancelled, so it stays there crossed out until the next day and Undo puts it back (EP-116)." }
        remind_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskStatus:
      enum: [inbox, next, doing, waiting, someday, done, cancelled]
    TaskFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: string, maxLength: 20000 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        context: { type: [string, "null"], example: "@home" }
        scheduled_on: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        recurrence: { type: [string, "null"], example: "FREQ=WEEKLY;BYDAY=MO,TH" }
        remind_at: { type: [string, "null"], format: date-time, description: "A reminder is pushed (and emailed when set up) at this time, once; a new time means a new reminder." }
    Checkin:
      type: object
      required: [kind, day, note, created_at]
      properties:
        kind: { enum: [daily, weekly, monthly] }
        day: { type: string, format: date }
        note: { type: string }
        created_at: { type: string, format: date-time }
    SearchHit:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          required: [rank, snippet]
          properties:
            rank: { type: number }
            snippet: { type: string, description: "A short excerpt; matched words are wrapped in U+0002 … U+0003." }
    Note:
      type: object
      required: [id, path, title, kind, para, tags, hash, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string, example: "Zettel/permanent/proofs.md" }
        title: { type: string, description: "Front-matter title, else the first heading, else the file name." }
        kind: { type: string, description: 'Front-matter type (fleeting, literature, permanent…), or "note".' }
        para: { $ref: "#/components/schemas/NotePara" }
        tags: { type: array, items: { type: string }, description: "From front matter tags: and #tags in the body, lower-cased." }
        hash: { type: string, description: "SHA-256 of the content, hex." }
        content: { type: string, description: "The Markdown exactly as written; omitted from lists." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NoteExploration:
      type: object
      required: [notes, stats, truncated]
      properties:
        truncated: { type: boolean, description: More notes matched than were analysed. }
        notes:
          type: array
          items:
            type: object
            required: [id, title, path, para, kind, tags, words, links, keywords, created_at, updated_at]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              path: { type: string }
              para: { $ref: "#/components/schemas/NotePara" }
              kind: { type: string }
              tags: { type: array, items: { type: string } }
              words: { type: integer }
              links: { type: integer, description: Connections in and out. }
              keywords: { type: array, items: { type: string } }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
        stats:
          type: object
          required: [total, orphans, words, by_month, by_para, by_kind, tags, keywords]
          properties:
            total: { type: integer }
            orphans: { type: integer }
            words: { type: integer }
            by_month: { $ref: "#/components/schemas/LabelCounts" }
            by_para: { $ref: "#/components/schemas/LabelCounts" }
            by_kind: { $ref: "#/components/schemas/LabelCounts" }
            tags: { $ref: "#/components/schemas/LabelCounts" }
            keywords: { $ref: "#/components/schemas/LabelCounts" }
    LabelCounts:
      type: array
      items:
        type: object
        required: [label, count]
        properties:
          label: { type: string }
          count: { type: integer }
    NoteBrief:
      type: object
      required: [id, title, kind]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        kind: { type: string }
    NoteTopic:
      type: object
      required: [id, label, terms, notes]
      properties:
        id: { type: integer }
        label: { type: string }
        terms: { type: array, items: { type: string } }
        notes: { type: array, items: { $ref: "#/components/schemas/NoteBrief" } }
    KeyPhrase:
      type: object
      required: [text, score]
      properties:
        text: { type: string }
        score: { type: number, description: "0 to 1, relative to the note's best phrase." }
    Readability:
      type: object
      required: [language, words, sentences, reading_minutes, ease]
      properties:
        language: { type: string, enum: [en, fr] }
        words: { type: integer }
        sentences: { type: integer }
        reading_minutes: { type: integer }
        ease: { type: number, description: "Flesch reading ease (English) or Kandel–Moles (French), 0 to 100." }
    NoteCorpusAnalysis:
      type: object
      required: [notes, words, languages, ease, topics, concepts, edges, truncated]
      properties:
        notes: { type: integer }
        words: { type: integer }
        languages: { type: object, additionalProperties: { type: integer } }
        ease: { type: number }
        topics: { type: array, items: { $ref: "#/components/schemas/NoteTopic" } }
        concepts:
          type: array
          items:
            type: object
            required: [id, text, notes, of]
            properties:
              id: { type: string }
              text: { type: string }
              notes: { type: integer }
              of: { type: [array, "null"], items: { $ref: "#/components/schemas/NoteBrief" } }
        edges:
          type: array
          items:
            type: object
            required: [from, to, relation, together, npmi, reason]
            properties:
              from: { type: string }
              to: { type: string }
              relation: { type: string, enum: [co-occurs, synonym] }
              together: { type: integer }
              npmi: { type: number }
              reason: { type: string }
        truncated: { type: boolean }
    NoteAnalysis:
      type: object
      required: [readability, phrases, topic, related]
      properties:
        readability: { $ref: "#/components/schemas/Readability" }
        phrases: { type: array, items: { $ref: "#/components/schemas/KeyPhrase" } }
        topic:
          oneOf:
            - $ref: "#/components/schemas/NoteTopic"
            - type: "null"
        related:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/NoteBrief"
              - type: object
                required: [similarity, reasons]
                properties:
                  similarity: { type: number }
                  reasons: { type: array, minItems: 1, items: { type: string } }
    ZettelGraph:
      type: object
      required: [nodes, edges, communities, stats, truncated]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, title, kind, community, pagerank, degree, bridge, participation, phrases]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              kind: { type: string }
              community: { type: integer }
              pagerank: { type: number, description: "0 to 1, relative to the most central note." }
              degree: { type: integer }
              bridge: { type: boolean }
              participation: { type: number }
              phrases: { type: array, items: { type: string } }
        edges:
          type: array
          items:
            type: object
            required: [from, to, score, kinds, reasons]
            properties:
              from: { type: string, format: uuid }
              to: { type: string, format: uuid }
              score: { type: number }
              kinds: { type: array, items: { type: string, enum: [link, phrases, synonyms, entities, wording] } }
              reasons: { type: array, minItems: 1, items: { type: string } }
        communities:
          type: array
          items:
            type: object
            required: [id, label, terms, size, core]
            properties:
              id: { type: integer }
              label: { type: string }
              terms: { type: array, items: { type: string } }
              size: { type: integer }
              core: { type: array, items: { $ref: "#/components/schemas/NoteBrief" } }
        stats:
          type: object
          required: [notes, edges, communities, modularity, density, isolated]
          properties:
            notes: { type: integer }
            edges: { type: integer }
            communities: { type: integer }
            modularity: { type: number }
            density: { type: number }
            isolated: { type: integer }
        truncated: { type: boolean }
    KnowledgeGraph:
      type: object
      required: [nodes, edges, truncated]
      properties:
        truncated: { type: boolean }
        nodes:
          type: array
          items:
            type: object
            required: [id, title, para, kind, keywords]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              para: { $ref: "#/components/schemas/NotePara" }
              kind: { type: string }
              keywords: { type: array, items: { type: string } }
        edges:
          type: array
          items:
            type: object
            required: [from, to, kind, why, weight]
            properties:
              from: { type: string, format: uuid }
              to: { type: string, format: uuid }
              kind: { enum: [link, entity, keyword, synonym, similar] }
              why: { type: string, example: "Shared keywords: memory, repetition" }
              weight: { type: number, minimum: 0, maximum: 1 }
    NotePara:
      type: string
      enum: [inbox, projects, areas, resources, archive, other]
      description: PARA category, from the top folder (0-Inbox, 1-Projects…); notes at the root are inbox.
    NotePath:
      type: string
      maxLength: 500
      example: "Zettel/idea.md"
      description: Relative, ending in .md, with no ".." or hidden folders.
    NoteContent:
      type: string
      maxLength: 1000000
    GoalStatus:
      type: string
      enum: [active, achieved, archived]
    Measure:
