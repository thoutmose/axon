    get:
      tags: [auth]
      operationId: finishProviderSignIn
      summary: "Where the provider sends the browser back: signs in, links, or (when registration is open) creates the account"
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: "To the page asked for, Account → Security, or the sign-in page with an error." }
        "429": { $ref: "#/components/responses/Problem" }
