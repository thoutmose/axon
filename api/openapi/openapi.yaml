        "200":
          description: Run records, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AgentRun" } }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/agent-runs/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [agents]
      operationId: getAgentRun
      summary: A run record, its proposals, and its reply (kept in memory for an hour, never stored)
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                type: object
                required: [run, reply, proposals, can_continue]
                properties:
                  run: { $ref: "#/components/schemas/AgentRun" }
                  reply: { type: [string, "null"] }
                  proposals: { type: array, items: { $ref: "#/components/schemas/Proposal" } }
                  can_continue: { type: boolean, description: "True while the conversation is held in memory (an hour), so you can answer the agent." }
