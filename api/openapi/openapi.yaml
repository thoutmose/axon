        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BudgetCategoryFields:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { enum: [income, expense], description: "On create only." }
        monthly_cents: { type: [integer, "null"], format: int64, minimum: 0, maximum: 100000000000 }
        archived: { type: boolean }
    BudgetTransaction:
      type: object
      required: [id, occurred_on, kind, amount_cents, category_id, account_id, to_account_id, tags, payee, note, recurring_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        occurred_on: { type: string, format: date }
        kind: { enum: [income, expense, transfer] }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        category_id: { type: [string, "null"], format: uuid }
        account_id: { type: [string, "null"], format: uuid, description: "Paid from (expense, transfer) or into (income)." }
        to_account_id: { type: [string, "null"], format: uuid, description: Transfers only. }
        tags: { type: array, items: { type: string } }
        payee: { type: string }
        note: { type: string }
        recurring_id: { type: [string, "null"], format: uuid, description: The recurring series that recorded it. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BudgetTransactionFields:
      type: object
      additionalProperties: false
      properties:
        occurred_on: { type: string, format: date }
        kind: { enum: [income, expense, transfer] }
        amount_cents: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
        category_id: { type: [string, "null"], format: uuid, description: "Without one, your rules may choose it." }
        account_id: { type: [string, "null"], format: uuid }
        to_account_id: { type: [string, "null"], format: uuid }
        tags: { type: array, maxItems: 20, items: { type: string, pattern: "^#?[A-Za-z0-9_-]{1,40}$" } }
        payee: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 2000 }
    BudgetMonth:
