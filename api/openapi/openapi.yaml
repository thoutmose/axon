        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Change a task; completing a recurring task creates its next occurrence once
      parameters:
        - $ref: "#/components/parameters/IfMatch"
