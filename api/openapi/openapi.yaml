        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskFields" }
      responses:
        "200":
          description: The updated task.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete a task and its links
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/tasks/bulk:
    post:
      tags: [tasks]
      operationId: bulkTasks
      summary: "Change or delete up to 200 tasks at once, all or none: status, context, scheduled or due date, recurrence, or notes (titles one at a time)"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids: { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
                delete: { type: boolean }
                change:
                  type: object
                  additionalProperties: false
                  properties:
                    status: { $ref: "#/components/schemas/TaskStatus" }
                    context: { type: [string, "null"] }
                    scheduled_on: { type: [string, "null"], format: date }
                    due_on: { type: [string, "null"], format: date }
                    recurrence: { type: [string, "null"] }
                    notes: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: How many tasks were changed or deleted.
          content:
            application/json:
              schema:
                type: object
                required: [changed]
                properties:
                  changed: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/contexts:
    get:
      tags: [tasks]
      operationId: listContexts
