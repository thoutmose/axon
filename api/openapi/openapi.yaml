  /v1/flashcards:
    get:
      tags: [cards]
      operationId: listCards
      summary: Your cards, newest first (up to 1,000), optionally in one deck or only leeches
      parameters:
        - { name: deck, in: query, schema: { type: string } }
        - { name: leech, in: query, description: "true: only cards forgotten so often that they need rewriting.", schema: { type: boolean } }
      responses:
        "200":
          description: Cards.
          content:
            application/json:
              schema:
                type: object
