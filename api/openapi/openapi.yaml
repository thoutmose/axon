                ratings: { type: object, additionalProperties: { type: integer, minimum: 0, maximum: 5 }, description: Self-rating per chosen domain. }
                answers: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: Chosen answer index per question id. }
      responses:
        "201":
