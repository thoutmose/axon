                        date: { type: string, format: date }
                        block: { type: string, description: "The plan's block for the day; empty without one." }
                        minutes: { type: integer }
                  skills: { type: array, items: { $ref: "#/components/schemas/FocusMinutes" } }
                  projects: { type: array, items: { $ref: "#/components/schemas/FocusMinutes" } }
