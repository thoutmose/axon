    SettingsDoc:
      type: object
      required: [language, appearance, templates]
      properties:
        language: { enum: [en, fr] }
        appearance:
          type: object
          required: [theme, font, font_size, icons, motion]
          additionalProperties: false
          properties:
            theme: { enum: [system, light, dark, sun], description: "sun follows the sun and the moon in the person's time zone: light from dawn to dusk." }
            font: { enum: [system, serif, rounded, mono] }
            font_size: { enum: [small, normal, large] }
            icons: { enum: [emoji, symbols, none] }
            motion: { enum: [system, reduced, full] }
            spaces: { enum: ["on", "off"], description: "Themed scenery for each area: a notebook for notes, a library for learning, a workshop for projects. On when absent." }
            scenery: { enum: [mountains, forest, ocean, desert, earth, eiffel-tower, pyramids, taj-mahal, statue-of-liberty, christ-the-redeemer, opera-house], description: "The landscape under the sky that follows the sun. Mountains when absent." }
        templates:
          type: object
          required: [note, project, resource]
          additionalProperties: false
          properties:
            note: { type: string, maxLength: 20000, description: "Markdown for new notes; {title} is replaced." }
            project:
              type: object
              required: [description, wip_limit, docs_folder]
              additionalProperties: false
              properties:
                description: { type: string, maxLength: 20000 }
                wip_limit: { type: [integer, "null"], minimum: 1, maximum: 50 }
                docs_folder: { type: string, maxLength: 200, description: "{slug} is replaced by the project's slug." }
            resource:
              type: object
              required: [section, kind]
              additionalProperties: false
              properties:
                section: { type: string, maxLength: 200 }
                kind: { enum: [hard, soft] }
        focus:
          type: object
          required: [work_minutes, short_break_minutes, long_break_minutes, rounds, sessions, sound, volume, music]
          additionalProperties: false
          description: "Pomodoro defaults: 25 min work and 5 min break twice, then 25 min work and a 15 min long break; one session."
          properties:
            work_minutes: { type: integer, minimum: 1, maximum: 180 }
            short_break_minutes: { type: integer, minimum: 1, maximum: 60 }
            long_break_minutes: { type: integer, minimum: 1, maximum: 120 }
            rounds: { type: integer, minimum: 1, maximum: 12, description: Work blocks before the long break. }
            sessions: { type: integer, minimum: 1, maximum: 12, description: How many cycles in a row. }
            sound:
              enum: [none, white, pink, brown, rain, music, lofi, ambient, piano]
              description: >-
                Focus sound generated in the browser: noise, or music composed as it plays ("music"
                matches the style to what the session is about).
            volume: { type: integer, minimum: 0, maximum: 100 }
            music:
              type: array
              maxItems: 20
              items:
                type: object
                required: [activity, url]
                additionalProperties: false
                properties:
                  activity: { type: string, maxLength: 100, example: coding }
                  url: { type: string, maxLength: 1000, example: "https://example.org/my-focus-playlist" }
        gamification:
          type: object
          required: [enabled]
          additionalProperties: false
          description: Progress rewards (XP, levels, badges, streak); off by default, and off hides every surface.
          properties:
            enabled: { type: boolean }
        vault:
          type: object
          required: [mirror, folder, health]
          additionalProperties: false
          description: "The vault mirror: tasks, goals, milestones, projects, areas, resources, habits, and media as Markdown notes under folder, both ways. Health logs and journal days only when health is on, one way."
          properties:
            mirror: { type: boolean }
            folder: { type: string, minLength: 1, maxLength: 100 }
            health: { type: boolean }
        learning:
          type: object
          required: [new_per_day, retention, interleave, type_answer]
          additionalProperties: false
          description: "The review engine: new cards per day (default 20), the retention FSRS aims for (default 0.90), mixed decks in a review of everything (default on), and typing the answer before it is shown (default off)."
          properties:
            new_per_day: { type: integer, minimum: 0, maximum: 500 }
            retention: { type: number, minimum: 0.7, maximum: 0.97 }
            interleave: { type: boolean }
            type_answer: { type: boolean }
        today:
          type: object
          required: [sections]
          additionalProperties: false
          description: "The sections Today shows, in order (counts stay at the top, progress at the bottom). Default: kpis, tasks, milestones, goals, notes, overview."
          properties:
            sections:
              type: array
              maxItems: 12
              uniqueItems: true
              items: { enum: [kpis, tasks, milestones, goals, notes, learning, habits, calendar, household, journal, water, caffeine, overview] }
        menu:
          type: object
          required: [hidden, chosen]
          additionalProperties: false
          description: "The pages left out of the navigation (they still open from a link or a search), and whether the person has said what they want Axon for. Default: none hidden, not chosen."
          properties:
            hidden:
              type: array
              maxItems: 21
              uniqueItems: true
              items: { enum: [tasks, projects, calendar, focus, notes, watch, areas, resources, archive, learn, goals, habits, health, media, budget, household, journal, digest, review, decisions, insights, agents] }
            chosen: { type: boolean }
        reminders:
          type: object
          required: [enabled, morning, evening, email]
          additionalProperties: false
          description: "Reminders: a morning digest and an evening nudge at local times (empty for none), and weekly and monthly digests, pushed to the devices turned on for them, and emailed when email is set and the instance can send mail. Off by default."
          properties:
            enabled: { type: boolean }
            morning: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$|^$", example: "08:00" }
            evening: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$|^$", example: "20:00" }
            email: { type: string, maxLength: 254 }
            weekly_day: { type: string, enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday], description: "The day of the weekly digest (EP-107)." }
            weekly_at: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$|^$", example: "18:00", description: "Empty for no weekly digest." }
            monthly_day: { type: integer, minimum: 1, maximum: 28 }
            monthly_at: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$|^$", example: "09:00", description: "Empty for no monthly digest." }
        digest:
          type: object
          additionalProperties: false
          description: "The digest template (EP-113): each digest's sections in order, and whether the quote and the picture come along. Left out on update, it keeps its defaults."
          properties:
            daily: { type: array, uniqueItems: true, items: { enum: [tasks, habits, coming, learn, watch] } }
            weekly: { type: array, uniqueItems: true, items: { enum: [open, week, reflect, watch] } }
            monthly: { type: array, uniqueItems: true, items: { enum: [goals, month, watch] } }
            quote: { type: boolean }
            picture: { type: boolean }
        caffeine:
          type: object
          additionalProperties: false
          description: "Coffee and tea (EP-117): bedtime, for the caffeine left then and the cut-off, and how fast the person clears caffeine (half-life fast 3 h, average 5 h, slow 7 h)."
          properties:
            bedtime: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", example: "23:00" }
            metabolism: { enum: [fast, average, slow] }
        podcast:
          type: object
          additionalProperties: false
          description: "The spoken tech watch (EP-113), off by default: format, language of the spoken links, length, period, and the device voice and pace."
          properties:
            enabled: { type: boolean }
            format: { enum: [briefing, digest, deep] }
            lang: { enum: [en, fr] }
            minutes: { type: integer, minimum: 3, maximum: 30 }
            days: { type: integer, enum: [1, 7] }
            voice: { type: string, maxLength: 200, description: "A voice of the speech server (AXON_TTS_URL) when it has one by that name, else the device's." }
            rate: { type: number, minimum: 0.5, maximum: 2 }
            hosts: { type: integer, minimum: 0, maximum: 2, description: "1, or 2 for a conversation where voice and voice2 take turns (EP-132); 0 reads as 1." }
            voice2: { type: string, maxLength: 200 }
        keyboard:
          type: object
          required: [shortcuts, vim]
          additionalProperties: false
          description: Left out on update, it keeps its current defaults.
          properties:
            shortcuts: { type: boolean, description: "Single-key and g-chord shortcuts; turn off if they get in the way (WCAG 2.1.4)." }
            vim: { type: boolean, description: Vim keybindings in the note editor. }
