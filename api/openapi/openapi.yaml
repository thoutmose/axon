  /v1/checkins/{kind}/{day}:
    put:
      tags: [tasks]
      operationId: checkIn
      summary: Record (or update) a daily, weekly, or monthly check-in
      description: Weekly check-ins are stored on the Monday of the week, monthly ones on the first of the month.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [daily, weekly, monthly] } }
        - { name: day, in: path, required: true, schema: { type: string, format: date } }
      requestBody:
        required: true
