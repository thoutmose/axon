      summary: Add a milestone to a goal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MilestoneFields"
                - required: [title]
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/milestones/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [goals]
      operationId: getMilestone
      summary: One milestone
      responses:
        "200":
          description: The milestone.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [goals]
      operationId: updateMilestone
      summary: Rename, reschedule, or complete a milestone
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneFields" }
      responses:
        "200":
          description: The updated milestone.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [goals]
      operationId: deleteMilestone
      summary: Delete a milestone and its links
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Today at a glance; every KPI carries the definition of what it counts
      responses:
        "200":
          description: The daily view.
          content:
            application/json:
              schema:
                type: object
                required: [today, kpis, tasks, done_today, goals, milestones, notes, checked_in, totals]
                properties:
                  today: { type: string, format: date }
                  kpis:
                    type: array
                    items:
                      type: object
                      required: [id, label, value, definition]
                      properties:
                        id: { enum: [overdue, today, inbox], description: "overdue, today, and inbox equal the size of the task view with that name." }
                        label: { type: string }
                        value: { type: integer }
                        definition: { type: string }
                  tasks: { type: array, maxItems: 10, description: "The first of today's tasks, overdue first.", items: { $ref: "#/components/schemas/Task" } }
                  done_today: { type: array, description: "Today's tasks done or cancelled today, crossed out until tomorrow (EP-116).", items: { $ref: "#/components/schemas/Task" } }
                  goals: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/Goal" } }
                  milestones:
                    type: array
                    maxItems: 10
                    description: Open milestones of active goals due in the next 14 days.
                    items:
                      type: object
                      required: [id, title, goal_id, goal_title, due_on]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        goal_id: { type: string, format: uuid }
                        goal_title: { type: string }
                        due_on: { type: string, format: date }
                  notes:
                    type: array
                    maxItems: 5
                    description: Most recently changed notes.
                    items:
                      type: object
                      required: [id, title, path, updated_at]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        path: { type: string }
                        updated_at: { type: string, format: date-time }
                  checked_in: { type: boolean, description: Today's daily check-in exists. }
                  totals:
                    type: object
                    description: How many tasks, notes, and goals exist, for first-run guidance.
                    required: [tasks, notes, goals]
                    properties:
                      tasks: { type: integer }
                      notes: { type: integer }
                      goals: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/dashboard/overview:
    get:
      tags: [dashboard]
      operationId: getDashboardOverview
      summary: The command dashboard; KPIs with their definitions and the previous period, daily series, a year of activity, tables, and the skills network
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 7, maximum: 365, default: 30 }, description: The period length. }
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                required: [today, days, kpis, series, activity, tables, skills]
                properties:
                  today: { type: string, format: date }
                  days: { type: integer }
                  kpis:
                    type: array
                    items:
                      type: object
                      required: [id, label, value, previous, unit, definition, href]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        value: { type: integer }
                        previous: { type: [integer, "null"], description: The same KPI over the period before; null when no comparison makes sense. }
                        unit: { enum: [count, percent, minutes] }
                        definition: { type: string }
                        href: { type: string, description: The page that lists the items behind the number. }
                  series:
                    type: array
                    items:
                      type: object
                      required: [id, label, points]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        points: { type: array, items: { $ref: "#/components/schemas/DayCount" } }
                  activity: { type: array, items: { $ref: "#/components/schemas/DayCount" }, description: Changes per day over the last 365 days. }
                  tables:
                    type: object
                    required: [due_soon, stalled_projects, learning]
                    properties:
                      due_soon:
                        type: array
                        items:
                          type: object
                          required: [id, title, due_on]
                          properties:
                            id: { type: string, format: uuid }
                            title: { type: string }
                            due_on: { type: string, format: date }
                      stalled_projects:
                        type: array
                        items:
                          type: object
                          required: [id, title, last_activity]
                          properties:
                            id: { type: string, format: uuid }
                            title: { type: string }
                            last_activity: { type: string, format: date-time }
                      learning:
                        type: array
                        items:
                          type: object
                          required: [id, title, roadmap_id, roadmap_title]
                          properties:
                            id: { type: string, format: uuid }
                            title: { type: string }
                            roadmap_id: { type: string, format: uuid }
                            roadmap_title: { type: string }
                  skills:
                    type: object
                    required: [nodes, edges]
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          required: [id, type, title]
                          properties:
                            id: { type: string, format: uuid }
                            type: { enum: [skill, goal, project, note] }
                            title: { type: string }
                            kind: { enum: [hard, soft] }
                            status: { enum: [todo, learning, done, skipped] }
                            roadmap_id: { type: string, format: uuid }
                      edges:
                        type: array
                        items:
                          type: object
                          required: [from, to, relation]
                          properties:
                            from: { type: string, format: uuid }
                            to: { type: string, format: uuid }
                            relation: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/calendar:
    get:
      tags: [dashboard]
      operationId: getCalendar
      summary: Dated tasks, goal target dates, milestones, and a started roadmap's study blocks in a range (at most 92 days)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: types
          in: query
          description: Comma-separated subset of task, goal, milestone, study, certification (default all).
          schema: { type: string, example: "task,milestone" }
      responses:
        "200":
          description: Events, oldest first. Cancelled tasks and archived goals are left out.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/me/calendar-feeds:
    get:
      tags: [dashboard]
      operationId: listCalendarFeeds
      summary: iCal feeds of this account
      security: [{ session: [] }]
      responses:
        "200":
          description: Feeds (their URLs are only shown at creation).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CalendarFeed" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [dashboard]
      operationId: createCalendarFeed
      summary: Create a read-only iCal feed of the chosen types
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, types]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100, example: Phone }
                types: { type: array, minItems: 1, items: { enum: [task, goal, milestone, study, certification] } }
      responses:
        "201":
          description: Created. Subscribe to path on this server; it is not shown again.
          content:
            application/json:
              schema:
                type: object
                required: [feed, path]
                properties:
                  feed: { $ref: "#/components/schemas/CalendarFeed" }
                  path: { type: string, example: "/api/v1/calendar-feeds/3q2-…ics" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/me/calendar-feeds/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      tags: [dashboard]
      operationId: revokeCalendarFeed
      summary: Revoke a feed; its URL stops working at once
      security: [{ session: [] }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/calendar-feeds/{token}.ics:
    get:
      tags: [dashboard]
      operationId: getCalendarFeed
      summary: The iCal file (all-day events, titles only, open items from 30 days ago to a year ahead)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The secret part of the feed URL.
          schema: { type: string }
      responses:
        "200":
          description: An RFC 5545 calendar.
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: Available agents, their skill versions and tools, and whether you can run them now
      responses:
        "200":
          description: Agents and your agent status.
          content:
            application/json:
              schema:
                type: object
                required: [status, agents]
                properties:
                  status: { $ref: "#/components/schemas/AgentStatus" }
                  agents:
                    type: array
                    items:
                      type: object
                      required: [name, title, version, description, tools]
                      properties:
                        name: { type: string, example: task-manager }
                        title: { type: string }
                        version: { type: string, description: Version of the SKILL.md the agent runs. }
                        consents: { type: array, items: { type: string }, description: "Consents this agent needs on top of ai_agents (health coaches: health_data and health_ai)." }
                        safety: { type: string, enum: [health], description: "Health guards: red-flag referral without a model call, and no unsafe restriction in replies or proposals." }
                        description: { type: string }
                        tools:
                          type: array
                          items:
                            type: object
                            required: [name, description, write]
                            properties:
                              name: { type: string }
                              description: { type: string }
                              write: { type: boolean, description: "true: calls become proposals you approve." }
