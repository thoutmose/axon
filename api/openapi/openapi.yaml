      responses:
        "200":
          description: The YAML file.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [account]
      operationId: putSettingsYAML
      summary: Apply a settings YAML file in one transaction; errors name the line
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/me/agent-provider:
    get:
      tags: [agents]
      operationId: getAgentProvider
      summary: Your AI provider for agents (keys are never returned)
      security: [{ session: [] }]
      responses:
        "200":
          description: Your settings, or null to use the server default.
          content:
            application/json:
              schema:
                type: object
                required: [settings, server_default, can_store_keys, providers]
                properties:
                  settings:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/ProviderSettings"
                  server_default: { type: boolean, description: The server has its own Anthropic key or OAuth profile. }
                  can_store_keys: { type: boolean, description: "false when the server has no AXON_ENCRYPTION_KEY." }
                  providers: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [agents]
      operationId: setAgentProvider
      summary: Choose the AI provider, model, key, and prices your agents use
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              additionalProperties: false
              properties:
                provider: { enum: [anthropic, deepseek, gemini, local, mistral, openai] }
                model: { type: string, minLength: 1, maxLength: 100, example: "claude-opus-5-5" }
                base_url: { type: string, maxLength: 300, description: "Local servers only, e.g. http://192.168.1.20:11434/v1." }
                api_key: { type: string, maxLength: 500, description: "Omit to keep the stored key; empty to remove it. Sealed at rest." }
                input_price: { type: number, minimum: 0, maximum: 1000, description: US$ per million input tokens. }
                output_price: { type: number, minimum: 0, maximum: 1000, description: US$ per million output tokens. }
      responses:
        "200":
          description: Saved; the same body as GET.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [agents]
      operationId: deleteAgentProvider
      summary: Go back to the server default provider
      security: [{ session: [] }]
      responses:
        "204": { description: Reverted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
