                source_id: { type: string, format: uuid }
                elaboration: { type: string, maxLength: 2000, description: "Why or how it is true (elaboration)." }
                example: { type: string, maxLength: 2000, description: A concrete example. }
                mnemonic: { type: string, maxLength: 2000, description: "A vivid image or mnemonic tying the question to the answer." }
                palace_id: { type: string, description: "A memory palace to place the card in, or empty to take it out." }
                locus: { type: integer, minimum: 0, maximum: 99, description: "The place in the palace (0 is the first)." }
      responses:
        "201":
          description: The card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flashcard" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/flashcards/due:
    get:
      tags: [cards]
      operationId: listDueCards
      summary: "What to review now: known cards due (oldest first), then new cards up to the day's allowance; across all decks, decks take turns (interleaving) unless turned off. Each card says when it would next be due for every rating."
      parameters:
        - { name: deck, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Due cards.
          content:
            application/json:
              schema:
                type: object
                required: [items, due_total]
                properties:
                  due_total: { type: integer }
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Flashcard"
                        - type: object
                          required: [next]
                          properties:
                            next:
                              type: object
                              required: [again, hard, good, easy]
                              properties:
                                again: { type: string, format: date-time }
                                hard: { type: string, format: date-time }
                                good: { type: string, format: date-time }
                                easy: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/flashcards/practice:
    get:
      tags: [cards]
      operationId: listPracticeCards
      summary: "Cards for deliberate practice: leeches first, then the cards closest to being forgotten. Practising them does not change their schedule."
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Cards to practise.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Flashcard" } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/flashcards/calibration:
    get:
      tags: [cards]
      operationId: getFlashcardCalibration
      summary: Whether the scheduler's predictions hold for this person
      description: >-
        At each review of a card in long-term memory, FSRS predicts the chance of recalling it; a review counts as
        remembered unless rated Again. Reviews of the last year, overall and grouped by prediction (empty groups left
        out), against the retention the person chose.
      responses:
        "200":
          description: The calibration.
          content:
            application/json:
              schema:
                type: object
                required: [reviews, predicted, remembered, target, buckets]
                additionalProperties: false
                properties:
                  reviews: { type: integer, minimum: 0 }
                  predicted: { type: number, minimum: 0, maximum: 1 }
                  remembered: { type: number, minimum: 0, maximum: 1 }
                  target: { type: number, minimum: 0, maximum: 1 }
                  buckets:
                    type: array
                    items:
                      type: object
                      required: [from, to, reviews, predicted, remembered]
                      additionalProperties: false
                      properties:
                        from: { type: number, minimum: 0, maximum: 1 }
                        to: { type: number, minimum: 0, maximum: 1 }
                        reviews: { type: integer, minimum: 1 }
                        predicted: { type: number, minimum: 0, maximum: 1 }
                        remembered: { type: number, minimum: 0, maximum: 1 }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/flashcards/export.apkg:
    get:
      tags: [cards]
      operationId: exportCardsAPKG
      summary: Download cards as an Anki package (all decks, or one with ?deck=), pictures included; cards arrive in Anki as new
      parameters:
        - { name: deck, in: query, schema: { type: string } }
      responses:
        "200":
          description: The .apkg file.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/flashcards/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
