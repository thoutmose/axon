      tags: [wellbeing]
      operationId: putHealthProfile
      summary: Save the profile the daily needs are worked out from
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [birth_year, sex, height_cm, weight_kg, activity]
              properties:
                birth_year: { type: integer, example: 1990 }
                sex: { type: string, enum: [female, male, unspecified] }
                height_cm: { type: number, minimum: 100, maximum: 250 }
                weight_kg: { type: number, minimum: 25, maximum: 350 }
                activity: { type: string, enum: [sedentary, light, moderate, active, very_active] }
                pregnant_or_breastfeeding: { type: boolean }
                updated_at: { type: string, format: date-time, description: Ignored. }
      responses:
        "200": { $ref: "#/components/responses/DailyNeeds" }
