          items:
            type: object
            required: [title, kind, by, free, url]
            properties:
              title: { type: string }
              kind: { type: string, enum: [book, course, video, channel, paper, site, practice] }
              by: { type: string }
              free: { type: boolean }
              url: { type: string }
              note: { type: string, description: "Duration and effort, for curriculum courses." }
        updated_at: { type: string, format: date-time }
    SkillFields:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 5000 }
        url: { type: string, maxLength: 1000 }
