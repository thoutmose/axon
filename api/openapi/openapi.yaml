              - $ref: "#/components/schemas/BudgetCategory"
              - type: object
                required: [actual_cents]
                properties:
                  actual_cents: { type: integer, format: int64 }
    ParaItem:
      type: object
      required: [id, title, description, url, status, linked, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        url: { type: [string, "null"] }
        status: { enum: [active, archived] }
        linked: { type: integer, description: Connections to and from it. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ParaFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 20000 }
        url: { type: string, maxLength: 1000, description: "http(s) link, or empty to clear." }
        status: { enum: [active, archived] }
    Skill:
      type: object
      required: [id, title, description, url, section, status, kind, position, resources, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        url: { type: [string, "null"] }
        section: { type: string }
        status: { enum: [todo, learning, done, skipped] }
        kind: { enum: [hard, soft], description: "Hard (technical) or soft (interpersonal, learning, leadership)." }
