  /v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: A view of the task list
      parameters:
        - name: view
          in: query
          description: today and week/month include overdue and upcoming dated work in the user's time zone; overdue is open work due before today; done is newest first.
          schema: { type: string, enum: [all, inbox, next, doing, waiting, someday, today, overdue, week, month, done], default: all }
        - name: context
          in: query
          schema: { type: string, example: "@home" }
        - name: after
          in: query
          description: next_cursor from the previous page.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of tasks.
          content:
            application/json:
              schema:
                type: object
                required: [items, today, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Task" } }
                  today: { type: string, format: date }
                  next_cursor: { type: [string, "null"] }
                  done_today: { type: array, items: { $ref: "#/components/schemas/Task" }, description: "The tasks of this view done or cancelled today, in the person's time zone, crossed out until tomorrow (EP-116). On the first page; absent for the done and overdue views." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [tasks]
      operationId: createTask
      summary: Capture or create a task (status inbox unless given)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TaskFields"
                - required: [title]
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [tasks]
      operationId: getTask
      summary: One task
      responses:
        "200":
          description: The task.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
