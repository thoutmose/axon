        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/roadmaps/{id}/skills:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [roadmaps]
      operationId: addSkill
      summary: Add a skill, optionally with prerequisites on the same roadmap
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SkillFields"
                - type: object
                  required: [title]
                  properties:
                    requires: { type: array, items: { type: string, format: uuid } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/skills/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [roadmaps]
      operationId: updateSkill
      summary: Change a skill (prerequisites are links with relation requires)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillFields" }
      responses:
        "200":
          description: The skill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [roadmaps]
      operationId: deleteSkill
      summary: Delete a skill and its links
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: axon_session
      description: Browser session; writes also need a matching Origin header.
    token:
      type: http
      scheme: bearer
      description: Personal access token (axon_…); read or write scope.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    After:
      name: after
      in: query
      description: next_cursor from the previous page.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last GET.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Any unique string (e.g. a UUID); retries with the same key and body replay the first response.
      schema: { type: string, maxLength: 200 }

  headers:
    ETag:
      description: Current version, for If-Match.
      schema: { type: string }

  requestBodies:
    WebAuthnCredential:
      required: true
      description: The browser's PublicKeyCredential, JSON-encoded (WebAuthn Level 3 toJSON()).
      content:
        application/json:
          schema: { type: object }
    TOTPCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            additionalProperties: false
            properties:
              code: { type: string }

  responses:
    Problem:
      description: RFC 9457 problem document.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    WebAuthnOptions:
      description: Options to pass to navigator.credentials (publicKey member).
      content:
        application/json:
          schema:
            type: object
            required: [publicKey]
            properties:
              publicKey: { type: object }
    SyncConflict:
      description: The note changed in Axon since the client last synced; keep both versions.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                required: [current]
                properties:
                  current:
                    oneOf:
                      - $ref: "#/components/schemas/Note"
                      - type: "null"
                    description: Axon's version, or null when the note was deleted in Axon.
    SignedIn:
      description: Signed in; the session cookie is set.
      content:
        application/json:
          schema:
            type: object
            required: [display_name]
            properties:
              display_name: { type: string }

  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Name:
      type: string
      minLength: 1
      maxLength: 100
    Cursor:
      type: [string, "null"]
      description: Pass back as after/before to get the next page; null on the last page.
    RecoveryCodes:
      type: array
      minItems: 10
      maxItems: 10
      items: { type: string, pattern: "^[a-z2-7]{4}-[a-z2-7]{4}-[a-z2-7]{4}-[a-z2-7]{4}$" }
    Me:
      type: object
      required: [id, display_name, timezone, created_at, totp_enabled, passkeys, recovery_codes_remaining, demo, avatar_updated_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        totp_enabled: { type: boolean }
        passkeys: { type: integer }
        recovery_codes_remaining: { type: integer }
        demo: { type: boolean, description: The shared demo account. }
        avatar_updated_at: { type: [string, "null"], format: date-time, description: "When the picture last changed; add it to the avatar URL to refresh caches." }
    Session:
      type: object
      required: [id, user_agent, created_at, last_seen_at, current]
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    Token:
      type: object
      required: [id, name, scope, created_at, last_used_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { enum: [read, write] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, ip, user_agent, details, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        ip: { type: string }
        user_agent: { type: string }
        details: { type: object }
        created_at: { type: string, format: date-time }
    Consent:
      type: object
      required: [id, description, granted, updated_at]
      properties:
        id: { type: string }
        description: { type: string }
        granted: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
    Relation:
      type: object
      required: [name, sources, targets]
      properties:
        name: { type: string }
        sources: { type: array, items: { type: string } }
        targets: { type: array, items: { type: string } }
    Entity:
      type: object
      required: [id, type, title, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Link:
      type: object
      required: [id, relation, entity, created_at]
      properties:
        id: { type: string, format: uuid }
        relation: { type: string }
        entity: { $ref: "#/components/schemas/Entity" }
        created_at: { type: string, format: date-time }
    Event:
      type: object
      required: [id, actor, entity_type, entity_id, kind, fields, created_at]
      properties:
        id: { type: string, format: uuid }
        actor: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        kind: { enum: [created, updated, deleted, linked, unlinked] }
        fields: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
    Task:
      type: object
      required: [id, title, notes, status, context, scheduled_on, due_on, recurrence, series_id, occurrence_on, completed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        notes: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        context: { type: [string, "null"] }
        scheduled_on: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        recurrence: { type: [string, "null"], description: "RFC 5545 RRULE, e.g. FREQ=WEEKLY;BYDAY=MO" }
        series_id: { type: [string, "null"], format: uuid }
        occurrence_on: { type: [string, "null"], format: date }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskStatus:
      enum: [inbox, next, doing, waiting, someday, done, cancelled]
    TaskFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: string, maxLength: 20000 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        context: { type: [string, "null"], example: "@home" }
        scheduled_on: { type: [string, "null"], format: date }
        due_on: { type: [string, "null"], format: date }
        recurrence: { type: [string, "null"], example: "FREQ=WEEKLY;BYDAY=MO,TH" }
    Checkin:
      type: object
      required: [kind, day, note, created_at]
      properties:
        kind: { enum: [daily, weekly, monthly] }
        day: { type: string, format: date }
        note: { type: string }
        created_at: { type: string, format: date-time }
    SearchHit:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          required: [rank, snippet]
          properties:
            rank: { type: number }
            snippet: { type: string, description: "A short excerpt; matched words are wrapped in U+0002 … U+0003." }
    Note:
      type: object
      required: [id, path, title, kind, para, tags, hash, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string, example: "Zettel/permanent/proofs.md" }
        title: { type: string, description: "Front-matter title, else the first heading, else the file name." }
        kind: { type: string, description: 'Front-matter type (fleeting, literature, permanent…), or "note".' }
        para: { $ref: "#/components/schemas/NotePara" }
        tags: { type: array, items: { type: string }, description: "From front matter tags: and #tags in the body, lower-cased." }
        hash: { type: string, description: "SHA-256 of the content, hex." }
        content: { type: string, description: "The Markdown exactly as written; omitted from lists." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NoteExploration:
      type: object
      required: [notes, stats, truncated]
      properties:
        truncated: { type: boolean, description: More notes matched than were analysed. }
        notes:
          type: array
          items:
            type: object
            required: [id, title, path, para, kind, tags, words, links, keywords, created_at, updated_at]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              path: { type: string }
              para: { $ref: "#/components/schemas/NotePara" }
              kind: { type: string }
              tags: { type: array, items: { type: string } }
              words: { type: integer }
              links: { type: integer, description: Connections in and out. }
              keywords: { type: array, items: { type: string } }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
        stats:
          type: object
          required: [total, orphans, words, by_month, by_para, by_kind, tags, keywords]
          properties:
            total: { type: integer }
            orphans: { type: integer }
            words: { type: integer }
            by_month: { $ref: "#/components/schemas/LabelCounts" }
            by_para: { $ref: "#/components/schemas/LabelCounts" }
            by_kind: { $ref: "#/components/schemas/LabelCounts" }
            tags: { $ref: "#/components/schemas/LabelCounts" }
            keywords: { $ref: "#/components/schemas/LabelCounts" }
    LabelCounts:
      type: array
      items:
        type: object
        required: [label, count]
        properties:
          label: { type: string }
          count: { type: integer }
    KnowledgeGraph:
      type: object
      required: [nodes, edges, truncated]
      properties:
        truncated: { type: boolean }
        nodes:
          type: array
          items:
            type: object
            required: [id, title, para, kind, keywords]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              para: { $ref: "#/components/schemas/NotePara" }
              kind: { type: string }
              keywords: { type: array, items: { type: string } }
        edges:
          type: array
          items:
            type: object
            required: [from, to, kind, why, weight]
            properties:
              from: { type: string, format: uuid }
              to: { type: string, format: uuid }
              kind: { enum: [link, entity, keyword, synonym, similar] }
              why: { type: string, example: "Shared keywords: memory, repetition" }
              weight: { type: number, minimum: 0, maximum: 1 }
    NotePara:
      type: string
      enum: [inbox, projects, areas, resources, archive, other]
      description: PARA category, from the top folder (0-Inbox, 1-Projects…); notes at the root are inbox.
    NotePath:
      type: string
      maxLength: 500
      example: "Zettel/idea.md"
      description: Relative, ending in .md, with no ".." or hidden folders.
    NoteContent:
      type: string
      maxLength: 1000000
    GoalStatus:
      type: string
      enum: [active, achieved, archived]
    Measure:
      type: object
      required: [unit, start, target, current]
      additionalProperties: false
      properties:
        unit: { type: string, minLength: 1, maxLength: 40, example: km }
        start: { type: number }
        target: { type: number, description: Must differ from start; may be below it (e.g. weight). }
        current: { type: number }
    Progress:
      type: object
      required: [percent, method, done, total, summary]
      properties:
        percent: { type: [integer, "null"], minimum: 0, maximum: 100, description: "Rounded down; null when there is nothing to measure." }
        method:
          enum: [measure, items, none]
          description: "measure: how far current moved from start to target. items: done milestones and linked tasks over all of them. none: nothing to measure yet."
        done: { type: integer }
        total: { type: integer }
        summary: { type: string, example: "3 of 5 milestones and linked tasks done" }
    Milestone:
      type: object
      required: [id, goal_id, title, due_on, done_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        goal_id: { type: string, format: uuid }
        title: { type: string }
        due_on: { type: [string, "null"], format: date }
        done_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MilestoneFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        due_on: { type: [string, "null"], format: date }
        done: { type: boolean }
    Goal:
      type: object
      required: [id, title, outcome, status, target_date, measure, progress, milestones, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        outcome: { type: string, description: What will be true when the goal is reached. }
        status: { $ref: "#/components/schemas/GoalStatus" }
        target_date: { type: [string, "null"], format: date }
        measure:
          oneOf:
            - $ref: "#/components/schemas/Measure"
            - type: "null"
        progress: { $ref: "#/components/schemas/Progress" }
        milestones: { type: array, items: { $ref: "#/components/schemas/Milestone" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GoalFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        outcome: { type: string, maxLength: 20000 }
        status: { $ref: "#/components/schemas/GoalStatus" }
        target_date: { type: [string, "null"], format: date }
        measure:
          oneOf:
            - $ref: "#/components/schemas/Measure"
            - type: "null"
    CalendarEvent:
      type: object
      required: [date, type, kind, id, title, done]
      properties:
        date: { type: string, format: date }
        type: { enum: [task, goal, milestone] }
        kind: { enum: [scheduled, due, target, milestone] }
        id: { type: string, format: uuid }
        title: { type: string }
        done: { type: boolean }
        goal_id: { type: string, format: uuid, description: The milestone's goal. }
    CalendarFeed:
      type: object
      required: [id, name, types, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        types: { type: array, items: { enum: [task, goal, milestone] } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    AgentStatus:
      type: object
      required: [available, reason, provider, monthly_budget_cents, spent_micros]
      properties:
        available: { type: boolean }
        provider: { type: [string, "null"], description: The provider runs would use. }
        reason: { type: [string, "null"], enum: [demo, not_configured, no_consent, budget_exhausted, null] }
        monthly_budget_cents: { type: integer }
        spent_micros: { type: integer, description: "US dollars × 1,000,000 spent this calendar month (UTC)." }
    AgentRun:
      type: object
      description: The audit record of a run. It never contains prompt, reply, or tool input text.
      required: [id, agent, skill_version, model, status, tools_called, proposals, input_tokens, output_tokens, cost_micros, error, started_at, finished_at, parent_run_id]
      properties:
        id: { type: string, format: uuid }
        parent_run_id: { type: [string, "null"], format: uuid, description: The run this one continues. }
        agent: { type: string }
        skill_version: { type: string }
        model: { type: string }
        status: { enum: [running, completed, budget_exhausted, step_limit, refused, failed] }
        tools_called: { type: array, items: { type: string }, example: ["list_tasks", "update_task:proposed", "denied:web_fetch"] }
        proposals: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_micros: { type: integer }
        error: { type: [string, "null"], enum: [provider_error, timeout, interrupted, internal, null] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    Proposal:
      type: object
      required: [id, run_id, agent, tool, input, summary, reason, status, created_at, decided_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        agent: { type: string }
        tool: { type: string }
        input: { type: object, description: "The validated change, applied as-is on approval." }
        summary: { type: string, example: "Change task “Call the plumber”: status → next, context → @phone" }
        reason: { type: string }
        status: { enum: [pending, approved, rejected, failed] }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
    Flashcard:
      type: object
      required: [id, deck, front, back, has_image, state, due, last_review, stability, difficulty, reps, lapses, suspended, updated_at]
      properties:
        id: { type: string, format: uuid }
        deck: { type: string }
        front: { type: string }
        back: { type: string }
        has_image: { type: boolean }
        state: { type: integer, enum: [1, 2, 3], description: "1 learning, 2 review, 3 relearning (FSRS)." }
        due: { type: string, format: date-time }
        last_review: { type: [string, "null"], format: date-time }
        stability: { type: [number, "null"], description: Days until recall drops to 90%. }
        difficulty: { type: [number, "null"], description: 1 (easy) to 10 (hard). }
        reps: { type: integer }
        lapses: { type: integer }
        suspended: { type: boolean }
        updated_at: { type: string, format: date-time }
    FocusSession:
      type: object
      required: [id, title, started_at, ended_at, planned_minutes, worked_minutes, rounds, status, target]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        planned_minutes: { type: integer }
        worked_minutes: { type: integer }
        rounds: { type: integer }
        status: { enum: [running, completed, stopped] }
        target:
          type: [object, "null"]
          required: [id, type, title]
          properties:
            id: { type: string, format: uuid }
            type: { type: string }
            title: { type: string }
    HabitScorecard:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [behavior, rating]
            additionalProperties: false
            properties:
              behavior: { type: string, minLength: 1, maxLength: 200, example: Check my phone }
              rating: { enum: ["+", "=", "-"] }
    HabitFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500, description: "The action: “Read one page”." }
        cue: { type: string, maxLength: 500 }
        craving: { type: string, maxLength: 500 }
        reward: { type: string, maxLength: 500 }
        stack_after: { type: string, maxLength: 500, example: "After I pour my coffee" }
        two_minute: { type: string, maxLength: 500, example: "Put on my running shoes" }
        days: { type: array, minItems: 1, maxItems: 7, items: { type: integer, minimum: 1, maximum: 7 }, description: "ISO weekdays in the user's time zone, 1 = Monday." }
        status: { enum: [active, paused, archived] }
        kind: { enum: [build, break], description: "build a good habit, or break a bad one. For break, cue, craving, two_minute, and reward hold how to make it invisible, unattractive, difficult, and unsatisfying." }
        identity: { type: string, maxLength: 500, example: "I am a person who reads every day" }
        intention_time: { type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$", example: "07:30", description: "Implementation intention: I will [behaviour] at [time] in [place]." }
        intention_place: { type: string, maxLength: 500, example: "in the kitchen" }
        contract_partner: { type: string, maxLength: 200, description: Optional accountability partner (Axon sends nothing to them). }
        contract_pledge: { type: string, maxLength: 2000 }
    Habit:
      type: object
      required: [id, title, cue, craving, reward, stack_after, two_minute, days, status, kind, identity, intention_time, intention_place, contract_partner, contract_pledge, votes, state, created_at, updated_at]
      properties:
        kind: { enum: [build, break], description: "build a good habit, or break a bad one. For break, cue, craving, two_minute, and reward hold how to make it invisible, unattractive, difficult, and unsatisfying." }
        identity: { type: string, example: "I am a person who reads every day" }
        intention_time: { type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$", example: "07:30", description: "Implementation intention: I will [behaviour] at [time] in [place]." }
        intention_place: { type: string, example: "in the kitchen" }
        contract_partner: { type: string, description: Optional accountability partner (Axon sends nothing to them). }
        contract_pledge: { type: string }
        votes: { type: integer, description: "Check-ins kept so far; each is a vote for the identity." }
        id: { type: string, format: uuid }
        title: { type: string }
        cue: { type: string }
        craving: { type: string }
        reward: { type: string }
        stack_after: { type: string }
        two_minute: { type: string }
        days: { type: array, items: { type: integer } }
        status: { enum: [active, paused, archived] }
        state:
          type: object
          required: [today, scheduled_today, checked_in, streak, recovery]
          properties:
            today: { type: string, format: date }
            scheduled_today: { type: boolean }
            checked_in: { type: [string, "null"], enum: [done, two_minute, skipped, null] }
            streak: { type: integer, description: "Scheduled days kept in a row, up to 366; planned skips neither count nor break it." }
            recovery:
              oneOf:
                - type: "null"
                - type: object
                  required: [missed, message]
                  properties:
                    missed: { type: integer, description: Scheduled days missed in a row (up to 7). }
                    message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HabitCheckin:
      type: object
      required: [day, status, note, created_at]
      properties:
        day: { type: string, format: date }
        status: { enum: [done, two_minute, skipped] }
        note: { type: string }
        created_at: { type: string, format: date-time }
    ProviderSettings:
      type: object
      required: [provider, model, base_url, has_key, input_price, output_price]
      properties:
        provider: { type: string }
        model: { type: string }
        base_url: { type: [string, "null"] }
        has_key: { type: boolean }
        input_price: { type: [number, "null"] }
        output_price: { type: [number, "null"] }
    Project:
      type: object
      required: [id, title, description, status, wip_limit, docs_folder, done, total, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { enum: [active, on_hold, done, archived] }
        wip_limit: { type: [integer, "null"] }
        docs_folder: { type: string, example: "1-Projects/axon" }
        done: { type: integer, description: Cards whose task is done. }
        total: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 20000 }
        status: { enum: [active, on_hold, done, archived] }
        wip_limit: { type: [integer, "null"], minimum: 1, maximum: 50 }
        docs_folder: { type: string, maxLength: 300 }
    Card:
      type: object
      required: [task_id, title, status, due_on, column, kind, parent_id, children_done, children]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        due_on: { type: [string, "null"], format: date }
        column: { enum: [backlog, todo, doing, done] }
        kind: { enum: [epic, issue, subtask] }
        parent_id: { type: [string, "null"], format: uuid }
        children_done: { type: integer }
        children: { type: integer }
    CardFields:
      type: object
      properties:
        column: { enum: [backlog, todo, doing, done] }
        kind: { enum: [epic, issue, subtask] }
        parent_id: { type: [string, "null"], format: uuid, description: "Issues belong to epics; sub-tasks to issues or epics." }
        before: { type: string, format: uuid, description: Place before this card; omit for the end of the column. }
        over_limit: { type: boolean, description: The person confirmed going over the WIP limit. }
    RepoConnection:
      type: object
      required: [id, owner, repo, has_token, allow_comments, project_id, created_at]
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        repo: { type: string }
        has_token: { type: boolean }
        allow_comments: { type: boolean, description: "false (default): the agents only read." }
        project_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    Roadmap:
      type: object
      required: [id, title, description, source, attribution, license_url, done, total, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        source: { enum: [manual, ossu, library, tutor] }
        attribution: { type: string, description: Shown with imported content. }
        license_url: { type: [string, "null"] }
        done: { type: integer }
        total: { type: integer, description: Skills not skipped. }
        skills: { type: array, items: { $ref: "#/components/schemas/Skill" } }
        edges:
          type: array
          items:
            type: object
            required: [link_id, from, to]
            properties:
              link_id: { type: string, format: uuid }
              from: { type: string, format: uuid, description: The skill that needs the other. }
              to: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SettingsDoc:
      type: object
      required: [language, appearance, templates]
      properties:
        language: { enum: [en, fr] }
        appearance:
          type: object
          required: [theme, font, font_size, icons, motion]
          additionalProperties: false
          properties:
            theme: { enum: [system, light, dark] }
            font: { enum: [system, serif, rounded, mono] }
            font_size: { enum: [small, normal, large] }
            icons: { enum: [emoji, symbols, none] }
            motion: { enum: [system, reduced, full] }
            spaces: { enum: ["on", "off"], description: "Themed scenery for each area: a notebook for notes, a library for learning, a workshop for projects. On when absent." }
        templates:
          type: object
          required: [note, project, resource]
          additionalProperties: false
          properties:
            note: { type: string, maxLength: 20000, description: "Markdown for new notes; {title} is replaced." }
            project:
              type: object
              required: [description, wip_limit, docs_folder]
              additionalProperties: false
              properties:
                description: { type: string, maxLength: 20000 }
                wip_limit: { type: [integer, "null"], minimum: 1, maximum: 50 }
                docs_folder: { type: string, maxLength: 200, description: "{slug} is replaced by the project's slug." }
            resource:
              type: object
              required: [section, kind]
              additionalProperties: false
              properties:
                section: { type: string, maxLength: 200 }
                kind: { enum: [hard, soft] }
        focus:
          type: object
          required: [work_minutes, short_break_minutes, long_break_minutes, rounds, sessions, sound, volume, music]
          additionalProperties: false
          description: "Pomodoro defaults: 25 min work and 5 min break twice, then 25 min work and a 15 min long break; one session."
          properties:
            work_minutes: { type: integer, minimum: 1, maximum: 180 }
            short_break_minutes: { type: integer, minimum: 1, maximum: 60 }
            long_break_minutes: { type: integer, minimum: 1, maximum: 120 }
            rounds: { type: integer, minimum: 1, maximum: 12, description: Work blocks before the long break. }
            sessions: { type: integer, minimum: 1, maximum: 12, description: How many cycles in a row. }
            sound: { enum: [none, white, pink, brown, rain], description: Focus sound generated in the browser. }
            volume: { type: integer, minimum: 0, maximum: 100 }
            music:
              type: array
              maxItems: 20
              items:
                type: object
                required: [activity, url]
                additionalProperties: false
                properties:
                  activity: { type: string, maxLength: 100, example: coding }
                  url: { type: string, maxLength: 1000, example: "https://example.org/my-focus-playlist" }
        gamification:
          type: object
          required: [enabled]
          additionalProperties: false
          description: Progress rewards (XP, levels, badges, streak); off by default, and off hides every surface.
          properties:
            enabled: { type: boolean }
        keyboard:
          type: object
          required: [shortcuts, vim]
          additionalProperties: false
          description: Left out on update, it keeps its current defaults.
          properties:
            shortcuts: { type: boolean, description: "Single-key and g-chord shortcuts; turn off if they get in the way (WCAG 2.1.4)." }
            vim: { type: boolean, description: Vim keybindings in the note editor. }
    Settings:
      allOf:
        - $ref: "#/components/schemas/SettingsDoc"
        - type: object
          properties:
            ai:
              type: object
              required: [provider, monthly_budget_cents]
              properties:
                provider:
                  type: [object, "null"]
                  description: Your provider, or null for the server default. The key itself is never returned.
                  properties:
                    provider: { type: string }
                    model: { type: string }
                    base_url: { type: [string, "null"] }
                    has_key: { type: boolean }
                    input_price: { type: [number, "null"] }
                    output_price: { type: [number, "null"] }
                monthly_budget_cents: { type: integer }
    AssessmentProfile:
      type: object
      required: [role, experience, goals, hours_per_week, formats]
      additionalProperties: false
      properties:
        role: { type: string, maxLength: 200, example: Support engineer }
        experience: { type: string, maxLength: 200, example: 3 years of scripting }
        goals: { type: string, maxLength: 2000 }
        hours_per_week: { type: integer, minimum: 0, maximum: 80 }
        formats: { type: array, items: { enum: [book, course, video, practice, paper] } }
    Assessment:
      type: object
      required: [id, created_at, profile, results, suggested]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        profile: { $ref: "#/components/schemas/AssessmentProfile" }
        results:
          type: array
          items:
            type: object
            required: [domain, title, rating, correct, total, level, reason]
            properties:
              domain: { type: string }
              title: { type: string }
              rating: { type: integer }
              correct: { type: integer }
              total: { type: integer }
              level: { type: integer, minimum: 0, maximum: 5 }
              reason: { type: string }
        suggested: { type: array, items: { type: string }, description: "Up to three library domains to start with, lowest level first." }
    DayCount:
      type: object
      required: [day, value]
      properties:
        day: { type: string, format: date }
        value: { type: integer }
    BudgetAccount:
      type: object
      required: [id, name, type, role, opening_cents, balance_cents, archived, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { enum: [asset, liability] }
        role: { enum: [checking, savings, cash, credit_card, loan, investment, other] }
        opening_cents: { type: integer, format: int64, description: "Negative for money owed." }
        balance_cents: { type: integer, format: int64, description: "Opening plus income, minus expenses, plus or minus transfers." }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BudgetAccountFields:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { enum: [asset, liability], description: On create only. }
        role: { enum: [checking, savings, cash, credit_card, loan, investment, other] }
        opening_cents: { type: integer, format: int64, minimum: -100000000000, maximum: 100000000000 }
        archived: { type: boolean }
    BudgetRecurring:
      type: object
      required: [id, name, kind, amount_cents, account_id, to_account_id, category_id, payee, note, tags, rule, next_on, active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { enum: [income, expense, transfer] }
        amount_cents: { type: integer, format: int64 }
        account_id: { type: [string, "null"], format: uuid }
        to_account_id: { type: [string, "null"], format: uuid }
        category_id: { type: [string, "null"], format: uuid }
        payee: { type: string }
        note: { type: string }
        tags: { type: array, items: { type: string } }
        rule: { type: string, example: "FREQ=MONTHLY;BYMONTHDAY=1" }
        next_on: { type: [string, "null"], format: date, description: Null once the series ended. }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BudgetRecurringFields:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { enum: [income, expense, transfer] }
        amount_cents: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
        account_id: { type: [string, "null"], format: uuid }
        to_account_id: { type: [string, "null"], format: uuid }
        category_id: { type: [string, "null"], format: uuid }
        payee: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 2000 }
        tags: { type: array, maxItems: 20, items: { type: string } }
        rule: { type: string, maxLength: 200, description: "RFC 5545 RRULE with FREQ DAILY, WEEKLY, MONTHLY, or YEARLY." }
        start_on: { type: string, format: date, description: "The next occurrence; setting it again restarts the series there." }
        active: { type: boolean }
    BudgetRule:
      type: object
