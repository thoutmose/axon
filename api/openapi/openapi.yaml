            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/me/settings.yaml:
    get:
      tags: [account]
      operationId: getSettingsYAML
      summary: Your settings as a commented YAML file; ai.provider.api_key is write-only and never exported
      responses:
        "200":
          description: The YAML file.
          content:
            application/yaml:
              schema: { type: string }
