version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
  settings:
    errcheck:
      # Progress output to the operator's terminal; a failed write is not actionable.
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
  exclusions:
    rules:
      # The French catalog: misspell checks English, and gosec reads "jeton" (token) messages as credentials.
      - path: internal/l10n/fr.go
        linters: [misspell, gosec]
formatters:
  enable:
    - gofmt
