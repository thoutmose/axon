version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
  settings:
    misspell:
      # French words in the French answers (EP-71).
      ignore-rules: [commandes, ressemble, exemple]
    errcheck:
      # Progress output to the operator's terminal; a failed write is not actionable.
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
formatters:
  enable:
    - gofmt
