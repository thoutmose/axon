name: release

# Tag a commit on main with vX.Y.Z to publish versioned images and SBOMs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        image:
          - { name: api, context: api }
          - { name: web, context: web }
          - { name: backup, context: deploy/backup }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/axon-${{ matrix.image.name }}:${{ github.ref_name }}
          push: true
          provenance: mode=max
          sbom: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/axon-${{ matrix.image.name }}:${{ github.ref_name }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image.name }}.spdx.json
          upload-release-assets: true
