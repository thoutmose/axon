name: ci

# Actions minutes are limited: pull requests that only change documentation
# skip CI, and images are built, scanned, and described (SBOM) on main only,
# where deploy.sh requires the whole run to be green. The e2e job still
# builds the api and web images for every pull request.
on:
  pull_request:
    paths-ignore: ["**/*.md", "doc/**", "LICENSE"]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: axon
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: axon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axon -d axon_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: api
      - run: go vet ./...
      - name: Known vulnerabilities (reachable code only)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Unit and integration tests
        run: go test -race -count=1 -p 1 ./...
        env:
          AXON_TEST_DATABASE_URL: postgres://axon:ci-only@localhost:5432/axon_test?sslmode=disable

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Generated API types match openapi.yaml
        run: npm run gen:api && git diff --exit-code src/lib/api-types.ts
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the OpenAPI document
        run: docker run --rm -v "$PWD/api/openapi:/spec" -w /spec redocly/cli:2.6.0 lint openapi.yaml
      - name: The French README keeps the English one's structure
        run: sh scripts/check-readme.sh

  anki:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
      - name: Exported decks import into Anki (official library)
        run: sh scripts/check-apkg.sh
      - name: The Anki bridge syncs with anki-sync-server (official library)
        run: sh scripts/check-anki-sync.sh

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: |
          cp .env.example .env
          echo AXON_DEMO=1 >> .env
          echo AXON_CALENDAR_PRIVATE=1 >> .env # the test follows Axon's own feed through Caddy
          docker compose up -d --build --wait
          docker compose exec -T api axon migrate up
          docker compose exec -T api axon demo reset
      - name: Playwright with axe (Chromium, virtual passkey)
        run: >-
          docker run --rm --network host -v "$PWD/web:/work" -w /work
          mcr.microsoft.com/playwright:v1.63.0-noble
          sh -c 'npm ci --no-fund --no-audit && npx playwright test'
      - name: Server logs on failure
        if: failure()
        run: docker compose logs --tail 200 api web caddy

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.0 git /repo --no-banner --redact

  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, context: api }
          - { name: web, context: web }
          - { name: backup, context: deploy/backup }
          - { name: anki, context: deploy/anki }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --build-arg VERSION=${{ github.sha }} -t axon-${{ matrix.image.name }}:ci ${{ matrix.image.context }}
      - name: Scan for fixable HIGH and CRITICAL vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          axon-${{ matrix.image.name }}:ci
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: axon-${{ matrix.image.name }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.image.name }}.spdx.json
