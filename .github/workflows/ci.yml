name: ci

# Jobs run on the self-hosted runner on srv-dev (label srv-dev), so they use
# no Actions minutes. Its Docker bridge networks have no internet: builds and
# downloads use the host's network, and the e2e stack runs as its own compose
# project on port 3200, beside the demo on 3000. Pull requests that only
# change documentation skip CI, and pull requests from forks never run on
# the self-hosted runner (the repository is public). Images are built,
# scanned, and described (SBOM) on pushes to main, where deploy.sh requires
# a green run.
on:
  pull_request:
    paths-ignore: ["**/*.md", "doc/**", "LICENSE"]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    # Never a fork's pull request: the runner is a server of ours (public repository).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, srv-dev]
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: axon
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: axon_test
        ports: ["5432:5432"]
        # tmpfs: the runner removes the container but not an anonymous data volume.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U axon -d axon_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: api
      - run: go vet ./...
      - name: Known vulnerabilities (reachable code only)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Unit and integration tests
        run: go test -race -count=1 -p 1 ./...
        env:
          AXON_TEST_DATABASE_URL: postgres://axon:ci-only@localhost:5432/axon_test?sslmode=disable
      - name: Free the runner's disk
        if: always()
        run: go clean -cache -testcache

  web:
    # Never a fork's pull request: the runner is a server of ours (public repository).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, srv-dev]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Generated API types match openapi.yaml
        run: npm run gen:api && git diff --exit-code src/lib/api-types.ts
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  spec:
    # Never a fork's pull request: the runner is a server of ours (public repository).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, srv-dev]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck the scripts
        run: git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -S warning
      - name: Lint the OpenAPI document
        run: docker run --rm -v "$PWD/api/openapi:/spec" -w /spec redocly/cli:2.6.0 lint openapi.yaml
      - name: The French README keeps the English one's structure
        run: sh scripts/check-readme.sh

  anki:
    # Never a fork's pull request: the runner is a server of ours (public repository).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, srv-dev]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
      - name: Exported decks import into Anki (official library)
        run: sh scripts/check-apkg.sh
      - name: The Anki bridge syncs with anki-sync-server (official library)
        run: sh scripts/check-anki-sync.sh

  e2e:
    # Never a fork's pull request: the runner is a server of ours (public repository).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, srv-dev]
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: axon-ci # never the demo's own stack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's|^AXON_BASE_URL=.*|AXON_BASE_URL=http://localhost:3200|' .env
          {
            echo AXON_PORT=3200
            echo AXON_VERSION=ci
            echo AXON_BUILD_NETWORK=host
            echo AXON_DEMO=1
            echo AXON_CALENDAR_PRIVATE=1 # the test follows Axon's own feed through Caddy
          } >> .env
          docker compose down -v --remove-orphans || true
          docker compose up -d --build --wait
          docker compose exec -T api axon migrate up
          docker compose exec -T api axon demo reset
      - name: Playwright with axe (Chromium, virtual passkey)
        run: >-
          docker run --rm --network host --ipc=host -e E2E_BASE_URL=http://localhost:3200
          -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/web:/work" -w /work
          mcr.microsoft.com/playwright:v1.63.0-noble
          sh -c 'npm ci --no-fund --no-audit && npx playwright test'
      - name: Server logs on failure
        if: failure()
        run: docker compose logs --tail 200 api web caddy
      - name: Stop the stack
        if: always()
        run: |
          docker compose down -v --remove-orphans --rmi all
          docker builder prune -af

  secrets:
    # Never a fork's pull request: the runner is a server of ours (public repository).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, srv-dev]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.0 git /repo --no-banner --redact

  images:
    if: github.event_name == 'push'
    runs-on: [self-hosted, srv-dev]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, context: api }
          - { name: web, context: web }
          - { name: backup, context: deploy/backup }
          - { name: anki, context: deploy/anki }
          - { name: caddy, context: deploy/caddy }
          - { name: db, context: deploy/db }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --network host --build-arg VERSION=${{ github.sha }} -t axon-${{ matrix.image.name }}:ci-image ${{ matrix.image.context }}
      - name: Scan for fixable HIGH and CRITICAL vulnerabilities
        run: >-
          docker run --rm --network host -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
          aquasec/trivy:0.74.0
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          axon-${{ matrix.image.name }}:ci-image
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: axon-${{ matrix.image.name }}:ci-image
          format: spdx-json
          artifact-name: sbom-${{ matrix.image.name }}.spdx.json
      - name: Free the runner's disk
        if: always()
        run: |
          docker rmi -f axon-${{ matrix.image.name }}:ci-image || true
          docker image prune -f
          docker builder prune -af
