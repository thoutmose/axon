# Local stack; servers add deploy/compose.server.yaml (restart policies, backups, metrics).
name: axon

services:
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    security_opt: [no-new-privileges:true] # no setuid escalation inside the container
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # the caddy binary carries this file capability; without it, it cannot start
    depends_on: [api, web]

  api:
    image: axon-api:${AXON_VERSION:-dev}
    build:
      context: ./api
      network: ${AXON_BUILD_NETWORK:-default} # "host" where bridge networks lack internet (see .env.example)
      args:
        VERSION: ${AXON_VERSION:-dev}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      AXON_BASE_URL: ${AXON_BASE_URL:?set AXON_BASE_URL in .env}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?set WEBAUTHN_RP_ID in .env}
      AXON_ENCRYPTION_KEY: ${AXON_ENCRYPTION_KEY:-}
      AXON_REGISTRATION: ${AXON_REGISTRATION:-first-user}
      AXON_DEMO: ${AXON_DEMO:-} # "1": offer the shared demo account (sample data, reset nightly)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-} # optional server default for agents
      AXON_ANTHROPIC_OAUTH: ${AXON_ANTHROPIC_OAUTH:-} # "1": use an "ant auth login" profile instead of a key
      ANTHROPIC_CONFIG_DIR: ${ANTHROPIC_CONFIG_DIR:-}
      AXON_ANKI_BRIDGE_URL: http://anki:8090 # the Anki bridge below (EP-42)
      ANKI_SYNC_URL: ${ANKI_SYNC_URL:-} # suggested anki-sync-server address, e.g. on srv-services
      AXON_CONTACT: ${AXON_CONTACT:-} # sent to Open Library and Open Food Facts, as they ask
      TMDB_API_KEY: ${TMDB_API_KEY:-} # film and series lookups (EP-17)
      USDA_API_KEY: ${USDA_API_KEY:-} # USDA FoodData Central search (EP-18)
      AXON_SMTP_URL: ${AXON_SMTP_URL:-} # reminder emails (EP-56): smtp://user:pass@host:587 or smtps://…:465
      AXON_SMTP_FROM: ${AXON_SMTP_FROM:-} # the sender address of reminder emails
      AXON_CALENDAR_PRIVATE: ${AXON_CALENDAR_PRIVATE:-} # "1": followed calendars may be on your own network (EP-58)
    security_opt: [no-new-privileges:true] # no setuid escalation inside the container
    cap_drop: [ALL] # needs no Linux capability
    depends_on:
      db:
        condition: service_healthy

  # Anki bridge (EP-42): the official Anki library syncing people's cards to
  # their anki-sync-server. Internal only; collections are rebuilt from the
  # sync server if lost, so they are not backed up.
  anki:
    image: axon-anki:${AXON_VERSION:-dev}
    build:
      context: ./deploy/anki
      network: ${AXON_BUILD_NETWORK:-default}
    volumes:
      - ankidata:/data
    security_opt: [no-new-privileges:true] # no setuid escalation inside the container
    cap_drop: [ALL] # needs no Linux capability

  web:
    image: axon-web:${AXON_VERSION:-dev}
    build:
      context: ./web
      network: ${AXON_BUILD_NETWORK:-default} # "host" where bridge networks lack internet (see .env.example)
    environment:
      API_URL: http://api:8080
      ORIGIN: ${AXON_BASE_URL:?set AXON_BASE_URL in .env}
    security_opt: [no-new-privileges:true] # no setuid escalation inside the container
    cap_drop: [ALL] # needs no Linux capability

  db:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
  ankidata:
