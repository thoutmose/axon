# Local development stack. Production hardening (TLS, secrets, backups) is EP-01.
name: axon

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api, web]

  api:
    build:
      context: ./api
      network: host # bridge networks on the dev host have no internet egress
      args:
        VERSION: ${AXON_VERSION:-dev}
    environment:
      AXON_ENV: ${AXON_ENV:?set AXON_ENV in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      network: host # bridge networks on the dev host have no internet egress
    environment:
      API_URL: http://api:8080
      ORIGIN: ${AXON_BASE_URL:?set AXON_BASE_URL in .env}

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  valkey:
    image: valkey/valkey:8-alpine

volumes:
  pgdata:
